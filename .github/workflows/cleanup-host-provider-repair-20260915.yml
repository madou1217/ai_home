name: cleanup merged host provider repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-host-provider-repair-20260915.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Delete only the verified merged branch
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/codex-host-provider-retention-20260915
          expected=28092c7924863b5426c37cb2b54af24516437ca3
          actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          if [ -n "$actual" ]; then
            test "$actual" = "$expected"
            git merge-base --is-ancestor "$expected" HEAD
            git push --force-with-lease="refs/heads/$branch:$expected" origin ":refs/heads/$branch"
          fi
          git rm .github/workflows/cleanup-host-provider-repair-20260915.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove completed host-provider branch cleanup workflow'
          git push origin HEAD:main
          git ls-remote --heads origin >> "$GITHUB_STEP_SUMMARY"

name: go-core-release

# 发布与 npm 版本匹配的 Go Core 预编译构件（scripts/postinstall-go-core.js 的下载源）。
# 资产命名：aih-server-<process.platform>-<process.arch>[.exe] 与同名 .sha256。
# CGO_ENABLED=0 纯 Go 交叉编译，全部目标在同一台 Linux runner 上构建。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach binaries to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: go-core-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "tag ${RELEASE_TAG} does not match package.json version v${version}" >&2
            exit 1
          fi

      - name: Build Go Core for every supported target
        run: |
          mkdir -p dist/go-core
          for target in darwin:arm64 darwin:x64 linux:x64 linux:arm64 win32:x64; do
            platform="${target%%:*}"
            arch="${target##*:}"
            node scripts/build-go-server.js --platform "$platform" --arch "$arch"
            suffix=""
            [ "$platform" = "win32" ] && suffix=".exe"
            asset="aih-server-${platform}-${arch}${suffix}"
            cp "bin/native/${platform}-${arch}/aih-server${suffix}" "dist/go-core/${asset}"
            (cd dist/go-core && sha256sum "${asset}" > "${asset}.sha256")
          done
          ls -la dist/go-core

      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 || gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "Go Core binaries for ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" dist/go-core/* --clobber

name: go-tests

# Go 的多平台验证。
#
# 各 job 分工：
#   - windows：`internal/runtime/artifactstore/junction_windows_test.go` 和
#     `internal/runtime/distributioninstall/service_sync_windows_test.go` 带
#     `//go:build windows`，在 macOS/Linux 上整文件被排除（`go test` 只报
#     `no test files`），必须由真正的 Windows runner 跑，才能固定住
#     junction 删除/重命名语义与安装器同步旧 `.ai_home/bin` 的行为。
#   - linux：补上非 Windows 侧的 vet + 编译，防止 `//go:build !windows` 分支漂移
#     或包里只有某个平台能编。Linux 也是发行目标之一，但只在打 tag 时才构建。
#   - relocated_scope：用 sessionscan 的依赖闭包判断改动是否需要三平台矩阵；
#     取不到 base 或依赖解析失败时默认运行（安全方向）。
#   - relocated-dirs：会话目录迁移测试，按 relocated_scope 的输出在 job 级跳过。
#
# 刻意不使用 workflow 级 paths/paths-ignore 过滤：被路径过滤跳过的 run 会让
# required status check 永远停在 "Pending"，把不相关的 PR 卡死（GitHub 文档明确写了
# 这一点）。windows 在 job 内检测改动；relocated-dirs 由独立 scope job 决定是否启动，
# 跳过的 job 仍有确定结论。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# main 上不取消进行中的运行：仓库推送很密，取消风暴会让每个提交都拿不到结论。
# PR 仍取消旧运行（push 到同一分支时以最新一次为准）。
concurrency:
  group: go-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    name: windows junction + installer sync + artifact store
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史做 base..head 的 diff（仓库 pack 约 45MB，代价可接受）。
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH

      # 只判断"这次改动是否需要 Windows 的 Go 验证"，重步骤据此跳过。
      # 判定失败/没有 base（新建分支、force push）时默认跑全量（安全方向）。
      #
      # 脚本正文保持纯 ASCII：Windows PowerShell 5.1 会把无 BOM 的 UTF-8 当 ANSI 读，
      # 中文注释可能破坏行结构（实测导致 pattern 变空、所有改动都被判为 Go 改动）。
      #
      # 匹配的根：编译入口（cmd/aih、internal/host/aihserver）传递依赖
      # internal、application、core、contracts（内嵌 json/sh/ps1）、cmd、
      # assets（内嵌 png）、native（内嵌 swift）；另有任意 *.go、go.mod/go.sum
      # 以及本工作流文件。
      - name: Detect Go-related changes
        id: scope
        shell: pwsh
        run: |
          $base = '${{ github.event.pull_request.base.sha }}'
          if (-not $base) { $base = '${{ github.event.before }}' }
          $head = '${{ github.sha }}'
          $go = 'true'
          $browser = 'true'
          if ($base -and $base -notmatch '^0+$') {
            $files = @(git diff --name-only $base $head 2>$null)
            if ($LASTEXITCODE -eq 0) {
              $pattern = '^(internal|application|core|contracts|cmd|assets|native)/|\.go$|^go\.(mod|sum)$|^\.github/workflows/go-tests\.yml$'
              $hit = @($files | Where-Object { $_ -match $pattern })
              $browserPattern = '^(internal/runtime/accountbrowser(host|view)(/|$)|native/account-browser/)'
              $browserHit = @($files | Where-Object { $_ -match $browserPattern })
              if ($hit.Count -eq 0) {
                $go = 'false'
              } else {
                $hit | Select-Object -First 20 | ForEach-Object { Write-Output ("changed: " + $_) }
              }
              if ($browserHit.Count -eq 0) {
                $browser = 'false'
              } else {
                $browserHit | Select-Object -First 20 | ForEach-Object { Write-Output ("browser changed: " + $_) }
              }
            }
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value ("go=" + $go) -Encoding ascii
          Add-Content -Path $env:GITHUB_OUTPUT -Value ("browser=" + $browser) -Encoding ascii
          Write-Output ("windows go checks needed: " + $go)
          Write-Output ("windows browser helper checks needed: " + $browser)

      - name: Vet
        if: steps.scope.outputs.go == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\aih-logs" | Out-Null
          go vet ./internal/runtime/artifactstore/... ./internal/runtime/spacegc/... ./internal/runtime/distributioninstall/... 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\aih-logs\vet-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test junction semantics
        if: steps.scope.outputs.go == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\aih-logs" | Out-Null
          go test -count=1 -v -timeout 5m ./internal/runtime/artifactstore/... 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\aih-logs\artifactstore-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows installer sync
        if: steps.scope.outputs.go == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\aih-logs" | Out-Null
          go test -count=1 -v -timeout 5m ./internal/runtime/distributioninstall/... 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\aih-logs\installer-sync-windows.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 生产二进制也要在 Windows 上编译通过：artifactstore/spacegc 被 server 引用，
      # 只测包不编译入口会漏掉"测试过、产品编不过"的情况。
      - name: Build CLI and server for windows
        if: steps.scope.outputs.go == 'true'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\aih-logs" | Out-Null
          $log = "$env:RUNNER_TEMP\aih-logs\build-windows.log"
          go build -trimpath -o "$env:RUNNER_TEMP\aih.exe" ./cmd/aih 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath -o "$env:RUNNER_TEMP\aih-server.exe" ./internal/host/aihserver 2>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET for browser helper
        if: steps.scope.outputs.browser == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # This builds the native surface helper and checks its explicit preflight
      # protocol. It does not claim that a hosted runner has validated Edge
      # startup, window capture, input, OAuth, or profile persistence.
      - name: Build and preflight Windows browser surface helper
        if: steps.scope.outputs.browser == 'true'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'aih-browser-surface'
          dotnet publish native/account-browser/windows/BrowserSurface.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            --output $output
          if ($LASTEXITCODE -ne 0) {
            throw 'dotnet publish failed'
          }
          $binary = Join-Path $output 'BrowserSurface.exe'
          if (-not (Test-Path -Path $binary -PathType Leaf)) {
            throw "published helper missing: $binary"
          }
          $raw = & $binary --preflight
          if ($LASTEXITCODE -ne 0) {
            throw 'browser helper preflight exited unsuccessfully'
          }
          $status = $raw | ConvertFrom-Json
          if ($status.type -ne 'preflight' -or -not $status.screenCapture -or -not $status.eventPosting) {
            throw "unexpected browser helper preflight: $raw"
          }
          Write-Output ("browser helper preflight: " + $raw)

      - name: No Go changes
        if: steps.scope.outputs.go != 'true'
        run: Write-Output 'no Go-related changes; Windows checks skipped'

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aih-logs"
          {
            echo "workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA ref=$GITHUB_REF"
            git status --short || true
            git log -3 --oneline || true
            go version || true
            go env || true
          } > "$RUNNER_TEMP/aih-logs/diagnostics.txt" 2>&1

      - name: Archive failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-failure-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aih-logs
          if-no-files-found: warn
          retention-days: 14

  # 非 Windows 侧不设门：冷启动约 1 分钟，且能第一时间暴露"只有 Linux 才编不过"
  # 的改动（例如新代码用了 darwin 专属 syscall 却漏了 build tag）。
  linux:
    name: linux build + vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH

      # 构建标签是"测试被静默跳过"的高发点：在 Linux 上检查 GOOS=windows 时
      # 该测试文件确实进入 TestGoFiles，并完成 vet + 测试二进制编译。真正的
      # 执行仍由 windows job 负责。
      - name: Verify Windows service sync build tags
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aih-logs"
          {
            files="$(GOOS=windows GOARCH=amd64 go list -f '{{join .TestGoFiles " "}}' ./internal/runtime/distributioninstall)"
            echo "GOOS=windows TestGoFiles: $files"
            case "$files" in
              *service_sync_windows_test.go*) ;;
              *) echo "service_sync_windows_test.go not selected by GOOS=windows" >&2; exit 1 ;;
            esac
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./internal/runtime/distributioninstall
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c ./internal/runtime/distributioninstall -o "$RUNNER_TEMP/service-sync-windows.test.exe"
          } 2>&1 | tee "$RUNNER_TEMP/aih-logs/build-tags-linux.log"

      - name: Vet
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aih-logs"
          go vet ./internal/runtime/artifactstore/... ./internal/runtime/spacegc/... 2>&1 | tee "$RUNNER_TEMP/aih-logs/vet-linux.log"

      - name: Test
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aih-logs"
          go test -count=1 -timeout 5m ./internal/runtime/artifactstore/... 2>&1 | tee "$RUNNER_TEMP/aih-logs/test-linux.log"

      # HostSupervisor 的配置替换/Close 并发只有 race detector 能覆盖。
      # job 级 CGO_ENABLED=0 是为了可复现构建；-race 这一步必须单独打开 CGO。
      - name: Race tests (codex environments)
        env:
          CGO_ENABLED: '1'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aih-logs"
          go test -count=1 -race -timeout 5m ./internal/runtime/codexenvironments/ 2>&1 | tee "$RUNNER_TEMP/aih-logs/race-linux.log"

      - name: Build CLI and server
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aih-logs"
          go build -trimpath -o "$RUNNER_TEMP/aih" ./cmd/aih 2>&1 | tee "$RUNNER_TEMP/aih-logs/build-linux.log"
          go build -trimpath -o "$RUNNER_TEMP/aih-server" ./internal/host/aihserver 2>&1 | tee -a "$RUNNER_TEMP/aih-logs/build-linux.log"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aih-logs"
          {
            echo "workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA ref=$GITHUB_REF"
            git status --short || true
            git log -3 --oneline || true
            go version || true
            go env || true
          } > "$RUNNER_TEMP/aih-logs/diagnostics.txt" 2>&1

      - name: Archive failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-failure-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aih-logs
          if-no-files-found: warn
          retention-days: 14

  # relocated-dirs 会占用三个平台（含容量紧张的 macOS arm64）。先用依赖闭包
  # 判断改动是否可能影响 sessionscan：只有相关目录、go.mod/go.sum 或本工作流
  # 变化时才启动矩阵；取不到 base 或依赖解析失败时默认运行（安全方向）。
  relocated_scope:
    name: relocated dirs scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.scope.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect relocated-dirs changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            base='${{ github.event.before }}'
          fi
          head='${{ github.sha }}'
          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "no usable base commit; running relocated-dirs tests"
            exit 0
          fi
          changed=$(mktemp)
          if ! git diff --name-only "$base" "$head" > "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "cannot diff $base..$head; running relocated-dirs tests"
            exit 0
          fi
          if ! deps=$(go list -deps -test ./internal/sessionscan/... \
            | grep '^github.com/madou1217/ai_home/.' \
            | sed -E 's/ \[.*$//' \
            | sed 's#^github.com/madou1217/ai_home/##' \
            | grep -v '\.test$' \
            | sort -u); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "dependency listing failed; running relocated-dirs tests"
            exit 0
          fi
          run=false
          if grep -Eq '^(go\.mod|go\.sum|\.github/workflows/go-tests\.yml)$' "$changed"; then
            run=true
          else
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              if grep -q "^${dep}/" "$changed"; then
                run=true
                break
              fi
            done <<< "$deps"
          fi
          echo "changed files:"
          sed -n '1,20p' "$changed"
          echo "relocated-dirs dependency roots: $(printf '%s\n' "$deps" | wc -l | tr -d ' ')"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "relocated-dirs tests needed: $run"

  # 会话发现要同时读当前配置根和迁移前的位置。路径/文件系统语义与平台有关，
  # 因此三个平台都跑同一组 relocated session directory 测试。
  relocated-dirs:
    name: relocated dirs (${{ matrix.os }})
    needs: relocated_scope
    if: needs.relocated_scope.result != 'success' || needs.relocated_scope.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain
        run: |
          go version
          go env GOOS GOARCH

      - name: Test relocated session directories
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/aih-logs"
          go test -count=1 -timeout 5m ./internal/sessionscan/... 2>&1 | tee "$RUNNER_TEMP/aih-logs/test-relocated-${{ matrix.os }}.log"

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/aih-logs"
          {
            echo "workflow=$GITHUB_WORKFLOW job=$GITHUB_JOB run=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "sha=$GITHUB_SHA ref=$GITHUB_REF"
            git status --short || true
            git log -3 --oneline || true
            go version || true
            go env || true
          } > "$RUNNER_TEMP/aih-logs/diagnostics.txt" 2>&1

      - name: Archive failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-tests-failure-${{ github.job }}-${{ runner.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aih-logs
          if-no-files-found: warn
          retention-days: 14

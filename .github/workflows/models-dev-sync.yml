name: models.dev sync

on:
  schedule:
    # 后台微轮询只更新仓库快照，不进入 Server 启动或请求热路径。
    - cron: '37 */2 * * *'
  workflow_dispatch:

concurrency:
  group: models-dev-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    name: update models.dev API snapshot and generated metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Synchronize models.dev API catalog and regenerate Go snapshot
        run: npm run models:sync

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            data/models-dev/catalog.json \
            internal/adapters/modelmetadata/modelsdev/modalities.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify generated snapshot and Go model metadata tests
        run: |
          npm run models:check
          go test ./internal/adapters/modelmetadata/modelsdev ./internal/tools/modelsdevmodalities
          git diff --check

      - name: Commit verified metadata to main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            data/models-dev/catalog.json \
            internal/adapters/modelmetadata/modelsdev/modalities.json
          git diff --cached --check
          git commit -m "chore(models): sync models.dev metadata"
          git push origin HEAD:main

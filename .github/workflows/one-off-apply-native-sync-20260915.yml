name: one-off verified native credential patch
on:
  push:
    branches: [fix/codex-native-credential-sync-20260915]
    paths: [.github/workflows/one-off-apply-native-sync-20260915.yml]
permissions:
  contents: write
jobs:
  apply-test-publish:
    if: contains(github.event.head_commit.message, '[aih-apply-native-20260915]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact source patches before applying
        shell: python
        run: |
          import base64, gzip, hashlib, os, pathlib, subprocess
          root = pathlib.Path('.github/aih-native-sync-transfer')
          encoded = ''.join((root / f'{n:02}.b64').read_text().strip() for n in [1, 2, 3])
          lost = '24uzul2Uqmu'
          if lost in encoded:
              assert encoded.count(lost) == 1
              encoded = encoded.replace(lost, '24uzkdf/i5PvXp6Wul2Uqmu')
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == '8e59e5b0af7ac807e1f937493b3ab463e5934f10871a5fb24de37da348f40642', 'transfer checksum mismatch'
          patch = gzip.decompress(data)
          assert len(patch) == 78843
          assert hashlib.sha256(patch).hexdigest() == 'ad4b8c4748369d79cc9097ad921d10356bded5782b2d28cd82438ae88324f89e'
          file = pathlib.Path(os.environ['RUNNER_TEMP']) / 'aih-native.patch'
          file.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(file)], check=True)
          subprocess.run(['git', 'apply', str(file)], check=True)
          followup = root / 'followup.patch'
          assert hashlib.sha256(followup.read_bytes()).hexdigest() == '4490be2e21bca4534735c4b6b7f448d645f3dd4537dd55fe78a24cc923799ac5'
          subprocess.run(['git', 'apply', '--check', str(followup)], check=True)
          subprocess.run(['git', 'apply', str(followup)], check=True)
          print('Both source patches matched local checksums and applied cleanly')
      - name: Install repository dependencies
        run: npm install
      - name: Check models snapshot
        run: npm run models:check
      - name: Native credential and existing lifecycle regressions
        run: |
          node --test test/codex-native-credential-sync.test.js test/codex-native-credential-integration.test.js test/codex-native-credential-pool.test.js test/host-sync.test.js test/server.codex-token-refresh.test.js test/server.token-refresh-daemon.test.js test/runtime-support.wiring.bootstrap.test.js test/account.claude-login-recovery.test.js test/grok-provider.test.js
      - name: Full repository tests
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/aih-full-test.log" 2>&1
          status=$?
          python3 - <<'PY'
          import os, pathlib
          lines = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'aih-full-test.log').read_text(errors='replace').splitlines()
          chosen = set(range(max(0,len(lines)-40),len(lines)))
          for i, line in enumerate(lines):
              if 'not ok ' in line:
                  chosen.update(range(max(0,i-2),min(len(lines),i+75)))
          for i in sorted(chosen): print(lines[i])
          PY
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-credential-full-test-log
          path: ${{ runner.temp }}/aih-full-test.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish verified code and remove temporary transfer workflows
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm -r .github/aih-native-sync-transfer
          git rm .github/workflows/one-off-apply-native-sync-20260915.yml .github/workflows/one-off-native-sync-ci-diagnostic-20260915.yml
          git add docs/architecture/codex-native-credential-sync.md lib/account/codex-credential-freshness.js lib/account/codex-native-credential-sync.js lib/account/host-sync.js lib/account/state-service.js lib/cli/bootstrap/runtime-support-wiring.js lib/server/account-credential-store-insert.js lib/server/accounts.js lib/server/codex-app-server-stdio-proxy-runtime.js lib/server/codex-token-refresh.js lib/server/token-refresh-daemon.js test/codex-native-credential-integration.test.js test/codex-native-credential-pool.test.js test/codex-native-credential-sync.test.js
          git add -u .github/workflows/one-off-branch-cleanup-20260915.yml .github/workflows/one-off-source-snapshot-20260915.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(codex): reconcile newer native App credentials without stale overwrite' -m 'Observe independent native file logins, resolve their canonical AIH identity, compare credential generation timestamps and publish via CAS. Preserve explicit API/OAuth defaults and independent native login choices. Reject late refresh writes and clear only stale Codex auth rejection without changing Claude/Grok recovery. Focused and full npm tests passed in this workflow; physical App/keychain and current official protocol validation remain outside this change. User authorized implementation and submission; self-review performed.'
          git push origin HEAD:refs/heads/fix/codex-native-credential-sync-20260915
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

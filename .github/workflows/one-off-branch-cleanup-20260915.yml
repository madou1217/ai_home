name: one-off requested branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-off-branch-cleanup-20260915.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[aih-cleanup-20260915]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Audit fixed branch snapshots; delete only ancestors of main
        shell: python
        run: |
          import subprocess, json, os
          branches = {
            'automation/models-dev-sync': '53f7c298ce0169a8931f9aeac35b1029d5cf54c1',
            'codex/account-egress-all-providers': '1de190ece2624ee9b1973678ca544f4b298fae39',
            'codex/live-toolkit-egress-integration-20260824': '8919a7bf57a518a08a12846b8dad99d9ce6efe87',
            'codex/request-details-delivery-20260824': 'e16a5431fe886a6d44a89c5ccccb900772460f56',
            'codex/toolkit-lifecycle-delivery-20260824': '25f44bbf682e07a7032153bcc90214ea2059198a',
            'fix/codex-fresh-login-handoff-20260915': 'e1c77893955c698e0f9ccccf47ff790c0045c325',
            'fix/codex-provider-lifecycle-20260915': '59d746cacb27fddcc5b2d1a0be70c3bfd6f2a050',
          }
          def git(*args):
              return subprocess.run(['git', *args], text=True, capture_output=True)
          report = []
          for branch, expected in branches.items():
              row = {'branch': branch, 'expected': expected}
              current = git('rev-parse', '--verify', 'refs/remotes/origin/' + branch)
              if current.returncode or current.stdout.strip() != expected:
                  row['status'] = 'preserved_head_changed_or_missing'
              elif git('merge-base', '--is-ancestor', expected, 'origin/main').returncode == 0:
                  result = git('push', '--force-with-lease=refs/heads/' + branch + ':' + expected,
                               'origin', ':refs/heads/' + branch)
                  row['status'] = 'deleted_merged' if result.returncode == 0 else 'delete_failed'
                  if result.returncode: row['error'] = result.stderr[-1000:]
              else:
                  cherry = git('cherry', 'origin/main', expected)
                  lines = [line for line in cherry.stdout.splitlines() if line]
                  row['patch_equivalent'] = sum(line.startswith('-') for line in lines)
                  row['independent_patches'] = sum(line.startswith('+') for line in lines)
                  merged = git('merge-tree', '--write-tree', 'origin/main', expected)
                  row['merge_clean'] = merged.returncode == 0
                  row['status'] = 'preserved_unmerged'
                  row['merge_preview'] = merged.stdout[-10000:]
              report.append(row)
              print(json.dumps(row, ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Requested branch cleanup\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          # Divergent branches are deliberately preserved; no history is discarded.
          if any(row['status'] == 'delete_failed' for row in report):
              raise SystemExit(1)

name: one-off branch integration snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-off-branch-history-20260915.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: contains(github.event.head_commit.message, '[aih-history-20260915]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export Git objects, not runner configuration or credentials
        run: |
          git bundle create "$RUNNER_TEMP/aih-branches.bundle" refs/remotes/origin/main refs/remotes/origin/automation/models-dev-sync refs/remotes/origin/codex/account-egress-all-providers refs/remotes/origin/codex/live-toolkit-egress-integration-20260824 refs/remotes/origin/codex/request-details-delivery-20260824 refs/remotes/origin/codex/toolkit-lifecycle-delivery-20260824
          git bundle verify "$RUNNER_TEMP/aih-branches.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: aih-branch-integration-20260915
          path: ${{ runner.temp }}/aih-branches.bundle
          retention-days: 1

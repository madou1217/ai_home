name: one-off source snapshot
on:
  push:
    branches: [main]
    paths: [.github/workflows/one-off-source-snapshot-20260915.yml]
permissions:
  contents: read
jobs:
  source:
    if: contains(github.event.head_commit.message, '[aih-source-20260915]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only, without Git credentials or runtime data
        run: git archive --format=zip --output="$RUNNER_TEMP/aih-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: aih-source-20260915
          path: ${{ runner.temp }}/aih-source.zip
          retention-days: 1

name: release-artifacts

# 构建每个平台的单文件安装包与目录归档，并附加到 GitHub Release。
# 标签必须与 package.json 版本一致；安装包自带 Node 与 WebUI，用户无需预装 Node。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach artifacts to (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch 时按输入的 tag 检出，保证 release-check 能看到 tag ref。
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${RELEASE_TAG}" ]; then
            echo "tag ${RELEASE_TAG} does not match package.json version v${version}" >&2
            exit 1
          fi

      - name: Install packaging tooling
        run: npm install --ignore-scripts --omit=optional --no-audit --no-fund

      - name: Install WebUI dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build WebUI
        run: npm run web:build

      - name: Build every platform artifact
        run: node scripts/package/build-release.js --targets all --skip-web-build --with-go --require-tag

      - name: Verify release tag and artifact checksums
        run: node scripts/release-check.js --tag "${RELEASE_TAG}" --no-head --require-artifacts

      - name: Smoke the Linux artifact
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates >/dev/null
          node scripts/package/smoke.js --artifact "dist/release/aih-$(node -p "require('./package.json').version")-linux-x64.run"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-home-release
          path: |
            dist/release/*.run
            dist/release/*.exe
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/*.sha256
            dist/release/aih-*-manifest.json
          if-no-files-found: error

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null 2>&1 \
            || gh release create "${RELEASE_TAG}" --title "${RELEASE_TAG}" --notes "AI Home ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" \
            dist/release/*.run \
            dist/release/*.exe \
            dist/release/*.tar.gz \
            dist/release/*.zip \
            dist/release/*.sha256 \
            dist/release/aih-*-manifest.json \
            --clobber

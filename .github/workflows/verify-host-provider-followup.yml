name: verify host provider followup
on:
  push:
    branches: [fix/codex-host-provider-retention-20260915]
    paths: [.github/workflows/verify-host-provider-followup.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply reviewed compatibility corrections
        shell: python
        run: |
          import pathlib, subprocess
          fixes = [
            ('lib/account/codex-host-provider.js', '7a1a1874e18d9e38e4371d2265bdfcd2d28947e5', '${quote(k)} = ${quote(v)}', '${JSON.stringify(String(k))} = ${JSON.stringify(String(v))}'),
            ('test/codex-native-credential-integration.test.js', '0b6ffd5d000ef268ff2fe1c7f97dc40f23fc21cf', '  assert.doesNotMatch(config, /model_providers\\.aih_server/);', '''  const registration = require('smol-toml').parse(config).model_providers.aih_server;
            assert.equal(registration.name, 'AIH Server');
            assert.ok(registration.auth.args.includes('--gateway'));
            assert.equal(registration.env_key, undefined);
            assert.equal(registration.bearer_token, undefined);''')
          ]
          for name, sha, old, new in fixes:
              assert subprocess.check_output(['git', 'hash-object', name], text=True).strip() == sha
              file = pathlib.Path(name)
              content = file.read_text()
              assert content.count(old) == 1, name
              file.write_text(content.replace(old, new))
          subprocess.run(['git', 'diff', '--check'], check=True)
      - name: Install dependencies
        run: npm install
      - name: All related configuration and credential regressions
        run: node --test test/codex-host-provider-lifecycle.test.js test/host-sync.test.js test/config-sync.test.js test/server.token-refresh-daemon.test.js test/codex-gateway-connection.test.js test/codex-native-credential-integration.test.js test/codex-native-credential-sync.test.js test/codex-native-credential-pool.test.js
      - name: Reproduce baseline failures and compare the full patched suite
        shell: bash
        run: |
          set -euo pipefail
          baseline=e9b5b5bf6f6b40f55b6591ed1c942f58cba9a0a7
          git worktree add --detach "$RUNNER_TEMP/aih-baseline" "$baseline"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/aih-baseline/node_modules"
          ln -s "$GITHUB_WORKSPACE/web/node_modules" "$RUNNER_TEMP/aih-baseline/web/node_modules"
          test -f "$RUNNER_TEMP/aih-baseline/web/node_modules/typescript/package.json"
          set +e
          (cd "$RUNNER_TEMP/aih-baseline" && node --test test/codebuddy-provider.test.js test/go-route-ownership-manifest.test.js) > "$RUNNER_TEMP/host-baseline.log" 2>&1
          baseline_status=$?
          npm test > "$RUNNER_TEMP/host-patched.log" 2>&1
          patched_status=$?
          set -e
          printf 'baseline-targeted=%s\npatched-full=%s\n' "$baseline_status" "$patched_status"
          python - <<'PY'
          import pathlib, os, re, json
          reports = {}
          for name in ['baseline', 'patched']:
              text = (pathlib.Path(os.environ['RUNNER_TEMP']) / f'host-{name}.log').read_text(errors='replace')
              lines = text.splitlines()
              failures = []
              for n, line in enumerate(lines):
                  if re.match(r'^not ok \d+ - ', line):
                      title = re.sub(r'^not ok \d+ - ', '', line)
                      failures.append(title)
                      print(name + ': ' + '\n'.join(lines[n:n+34]))
              reports[name] = failures
              print(name + ' summary:\n' + '\n'.join(lines[-18:]))
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'host-test-comparison.json').write_text(json.dumps(reports, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Baseline targeted reproduction vs full patched suite\n```json\n' + json.dumps(reports, indent=2) + '\n```\n')
          assert sorted(reports['baseline']) == sorted(reports['patched']), 'Additional full-suite failure detected; publication blocked'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-provider-baseline-comparison
          path: |
            ${{ runner.temp }}/host-baseline.log
            ${{ runner.temp }}/host-patched.log
            ${{ runner.temp }}/host-test-comparison.json
          retention-days: 3
      - name: Publish tested correction without weakening unrelated tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/verify-host-provider-followup.yml
          git add lib/account/codex-host-provider.js test/codex-native-credential-integration.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(codex): preserve header serialization and update OAuth retention integration contract' -m 'Retain all native credential assertions, replace only the obsolete OAuth-provider-deletion expectation. Related real-file/SQLite/daemon tests pass. Full patched suite retains three failures separately reproduced in unchanged main tests: WorkBuddy install plan and two Go route-manifest contracts. No unrelated assertions skipped or weakened. This is not full-suite success; see the workflow artifact for actual baseline and patched results.'
          git push origin HEAD:refs/heads/fix/codex-host-provider-retention-20260915

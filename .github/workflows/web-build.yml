name: web-build

on:
  push:
    branches:
      - main
  pull_request:

# main 上排队跑完，不因后续推送取消；PR 仍以最新一次为准。
concurrency:
  group: web-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: web lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        working-directory: web
        run: pnpm install

      - name: Lint web
        working-directory: web
        run: pnpm run lint

      - name: Build web
        working-directory: web
        run: pnpm run build

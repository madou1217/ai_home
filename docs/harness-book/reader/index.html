<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现代 AI Agent 运行时与 Harness 架构设计 | 沉浸式互动读本</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Markdown & Syntax Highlight & Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-vsc-dark-plus.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <style>
    /* ========================================================= */
    /* 🌌 Linear / Vercel 级顶级超现代设计语言 (Design Tokens)   */
    /* ========================================================= */
    :root {
      --bg-canvas: #030712;
      --bg-sidebar: #090d16;
      --bg-card: rgba(17, 24, 39, 0.75);
      --bg-card-hover: rgba(31, 41, 55, 0.85);
      --bg-elevated: #111827;
      --bg-tertiary: #1f2937;
      
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-medium: rgba(255, 255, 255, 0.12);
      --border-bright: rgba(56, 189, 248, 0.35);
      
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #64748b;
      --text-dim: #475569;
      
      --brand-sky: #38bdf8;
      --brand-cyan: #06b6d4;
      --brand-blue: #3b82f6;
      --brand-violet: #8b5cf6;
      --brand-emerald: #10b981;
      --brand-amber: #f59e0b;
      --brand-rose: #f43f5e;
      
      --gradient-brand: linear-gradient(135deg, #38bdf8 0%, #8b5cf6 50%, #ec4899 100%);
      --gradient-surface: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(255, 255, 255, 0) 100%);
      --gradient-card: linear-gradient(145deg, rgba(17, 24, 39, 0.9) 0%, rgba(15, 23, 42, 0.6) 100%);
      
      --sidebar-width: 320px;
      --ai-panel-width: 440px;
      --font-sans: "Plus Jakarta Sans", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", "Fira Code", monospace;
    }

    [data-theme="light"] {
      --bg-canvas: #f8fafc;
      --bg-sidebar: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-card-hover: #ffffff;
      --bg-elevated: #ffffff;
      --bg-tertiary: #e2e8f0;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-medium: rgba(0, 0, 0, 0.1);
      --border-bright: rgba(2, 132, 199, 0.35);
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --gradient-card: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--text-secondary);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: absolute;
      top: -200px;
      left: 30%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(139, 92, 246, 0.04) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Reading Progress Top Line */
    #reading-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 2.5px;
      background: var(--gradient-brand);
      width: 0%;
      z-index: 1000;
      transition: width 0.15s ease-out;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.7);
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      backdrop-filter: blur(20px);
    }
    
    .sidebar-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--gradient-surface);
    }
    
    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-logo-gem {
      width: 28px;
      height: 28px;
      background: var(--gradient-brand);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .brand-text {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
    }

    .nav-search-container {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }
    .nav-search-box {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 12px 8px 34px;
      color: var(--text-primary);
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    .nav-search-box:focus {
      border-color: var(--brand-sky);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .search-icon-pos {
      position: absolute;
      left: 28px;
      top: 21px;
      font-size: 12px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-kbd-shortcut {
      position: absolute;
      right: 24px;
      top: 18px;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--text-dim);
      background: var(--bg-tertiary);
      border: 1px solid var(--border-subtle);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .nav-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px;
    }
    .part-group-header {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 14px 12px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-item-btn {
      display: flex;
      align-items: center;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
      margin-bottom: 2px;
      line-height: 1.45;
      position: relative;
      border: 1px solid transparent;
    }
    .nav-item-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }
    .nav-item-btn.active {
      background: var(--accent-bg);
      color: var(--brand-sky);
      font-weight: 600;
      border-color: var(--accent-border);
    }
    .nav-item-btn.read-done::after {
      content: "✓";
      position: absolute;
      right: 10px;
      font-size: 11px;
      color: var(--brand-emerald);
      font-weight: 700;
    }

    /* Main Container */
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
      background: var(--bg-canvas);
      z-index: 10;
    }
    
    .top-glass-bar {
      height: 56px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      flex-shrink: 0;
      z-index: 30;
    }
    .top-breadcrumbs {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .breadcrumb-part { color: var(--text-muted); font-weight: 500; }
    .breadcrumb-sep { color: var(--text-dim); }
    .breadcrumb-title { color: var(--text-primary); font-weight: 600; }
    
    .top-action-pills {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .glass-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }
    .glass-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-medium);
      color: var(--text-primary);
      transform: translateY(-1px);
    }
    .glass-btn-primary {
      background: var(--gradient-brand);
      color: #ffffff;
      border: none;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }
    .glass-btn-primary:hover {
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
      transform: translateY(-1px);
    }

    .article-scroll-view {
      flex: 1;
      overflow-y: auto;
      padding: 48px 80px 140px;
      scroll-behavior: smooth;
      position: relative;
    }

    /* Markdown Body 排版 */
    .markdown-body {
      max-width: 900px;
      margin: 0 auto;
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--text-secondary);
      letter-spacing: -0.01em;
    }
    .markdown-body h1 {
      font-size: 30px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      line-height: 1.3;
    }
    .markdown-body h2 {
      font-size: 21px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      margin: 48px 0 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .markdown-body h3 {
      font-size: 17px;
      font-weight: 700;
      color: var(--brand-sky);
      margin: 32px 0 16px;
    }
    .markdown-body p, .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
    }
    .markdown-body blockquote {
      border-left: 4px solid var(--brand-sky);
      background: var(--accent-bg);
      border-radius: 0 10px 10px 0;
      padding: 16px 24px;
      margin: 28px 0;
      color: var(--text-primary);
      font-size: 15px;
      line-height: 1.75;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 32px 0;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      overflow: hidden;
      font-size: 13.5px;
      background: var(--bg-card);
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }
    .markdown-body th {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      font-weight: 700;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-medium);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .markdown-body td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-secondary);
    }
    .markdown-body tr:last-child td { border-bottom: none; }
    .markdown-body tr:hover td { background: var(--bg-card-hover); }

    .markdown-body code:not([class*="language-"]) {
      background-color: var(--bg-tertiary);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--brand-sky);
      border: 1px solid var(--border-subtle);
    }
    
    .code-block-wrapper {
      position: relative;
      margin: 26px 0;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
      background: #090d16;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .code-block-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .code-lang-tag {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }
    .code-copy-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 11px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .code-copy-btn:hover {
      color: var(--text-primary);
      border-color: var(--brand-sky);
    }
    .markdown-body pre {
      background: transparent !important;
      padding: 18px !important;
      margin: 0 !important;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.7;
    }

    /* AI Concept Hero Banner */
    .ai-concept-hero {
      margin: 32px 0 42px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border-medium);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      position: relative;
      background: #000000;
      cursor: zoom-in;
    }
    .ai-concept-hero img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .ai-concept-hero:hover img { transform: scale(1.03); }
    .ai-hero-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(9, 13, 22, 0.85) 40%, rgba(9, 13, 22, 0.98) 100%);
      padding: 32px 24px 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      backdrop-filter: blur(6px);
    }
    .hero-cap-title { font-size: 14px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
    .hero-cap-badge {
      font-size: 11px;
      font-weight: 700;
      background: var(--accent-bg);
      color: var(--brand-sky);
      border: 1px solid var(--accent-border);
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* Rich Diagram Box */
    .rich-diagram-box {
      background: var(--gradient-card);
      border: 1px solid var(--border-medium);
      border-radius: 14px;
      padding: 26px;
      margin: 36px 0;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .rich-diagram-box::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: var(--gradient-brand);
    }
    .diagram-header-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--brand-sky);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      padding: 3px 12px;
      border-radius: 20px;
      margin-bottom: 18px;
    }
    .diagram-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .harness-stack { display: flex; flex-direction: column; gap: 14px; }
    .stack-layer {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 16px 20px;
      transition: all 0.2s;
    }
    .stack-layer:hover {
      border-color: var(--accent-border);
      background: rgba(255, 255, 255, 0.04);
      transform: translateY(-1px);
    }
    .layer-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
    }
    .chips-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .chips-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .chips-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .chips-flex-wrap { display: flex; flex-wrap: wrap; gap: 10px; }

    .tech-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: all 0.15s;
    }
    .tech-card:hover { border-color: var(--border-medium); transform: translateY(-1px); }
    .tech-card.blue { border-left: 3px solid var(--brand-sky); }
    .tech-card.purple { border-left: 3px solid var(--brand-violet); }
    .tech-card.green { border-left: 3px solid var(--brand-emerald); }
    .tech-card.orange { border-left: 3px solid var(--brand-amber); }
    .tech-card.red { border-left: 3px solid var(--brand-rose); }
    .tech-card.cyan { border-left: 3px solid var(--brand-cyan); }

    .card-label { font-size: 12.5px; font-weight: 700; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
    .card-sub { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }
    
    .flow-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 6px 0;
    }
    .split-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .col-box { background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 18px; }
    .col-title { font-size: 13.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }

    /* AI Copilot Panel */
    #ai-panel {
      width: var(--ai-panel-width);
      background-color: var(--bg-sidebar);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      backdrop-filter: blur(20px);
    }
    #ai-panel.collapsed {
      width: 0;
      border-left: none;
      display: none;
    }
    .ai-panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--gradient-surface);
    }
    .ai-panel-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ai-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chat-bubble {
      max-width: 90%;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.65;
      word-break: break-word;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: var(--gradient-brand);
      color: #ffffff;
      border-bottom-right-radius: 2px;
      font-weight: 500;
    }
    .chat-bubble.ai {
      align-self: flex-start;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      border-bottom-left-radius: 2px;
    }
    .ai-input-box {
      padding: 16px;
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-sidebar);
    }
    .ai-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ai-textarea {
      width: 100%;
      height: 80px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: all 0.2s;
    }
    .ai-textarea:focus {
      border-color: var(--brand-sky);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }
    .ai-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ai-mode-pill {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Lightbox Modal */
    #image-lightbox-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(3, 7, 18, 0.95);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 40px;
      cursor: zoom-out;
      animation: fadeIn 0.2s ease;
    }
    #image-lightbox-modal img, #image-lightbox-modal svg {
      max-width: 92vw;
      max-height: 92vh;
      border-radius: 12px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.9);
      border: 1px solid var(--border-medium);
      background: var(--bg-canvas);
      object-fit: contain;
    }
    .lightbox-close-hint {
      position: absolute;
      top: 24px;
      right: 32px;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* Floating Bubble for text selection */
    #selection-ai-bubble {
      position: absolute;
      display: none;
      z-index: 100;
      background: var(--bg-card);
      border: 1px solid var(--brand-sky);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border-radius: 24px;
      padding: 7px 16px;
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      align-items: center;
      gap: 8px;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
    }
    #selection-ai-bubble:hover {
      background: var(--brand-sky);
      color: #000000;
      transform: scale(1.05);
    }

    .chapter-nav-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 70px;
      padding-top: 32px;
      border-top: 1px solid var(--border-subtle);
    }

    @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <!-- Ambient Glow -->
  <div class="ambient-glow"></div>

  <!-- Top Reading Progress Indicator -->
  <div id="reading-progress-bar"></div>

  <!-- Left Chapter Navigation -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <a href="#" class="sidebar-brand">
        <div class="brand-logo-gem">⚡</div>
        <span class="brand-text">Agent Harness OS</span>
      </a>
      <button class="glass-btn" id="theme-toggle" title="切换主题" style="padding:4px 8px;">🌓</button>
    </div>
    <div class="nav-search-container">
      <span class="search-icon-pos">🔍</span>
      <input type="text" id="chapter-search" class="nav-search-box" placeholder="搜索 26 篇全景章节或架构...">
      <span class="search-kbd-shortcut">⌘K</span>
    </div>
    <div class="nav-list-scroll" id="chapter-list">
      <!-- Injected via JavaScript -->
    </div>
  </aside>

  <!-- Main Article Area -->
  <main id="main-container">
    <header class="top-glass-bar">
      <div class="top-breadcrumbs">
        <button class="glass-btn" id="toggle-sidebar-btn" title="折叠/展开目录" style="padding:5px 10px;">☰ 目录</button>
        <span class="breadcrumb-sep">/</span>
        <span id="current-chapter-title" class="breadcrumb-title">加载中...</span>
      </div>
      <div class="top-action-pills">
        <button class="glass-btn" id="byok-settings-btn">⚙️ AI 接入设置</button>
        <button class="glass-btn glass-btn-primary" id="toggle-ai-panel-btn">✨ AI 伴读顾问</button>
      </div>
    </header>

    <div class="article-scroll-view" id="article-scroll">
      <article class="markdown-body" id="article-content">
        <!-- Injected via JavaScript -->
      </article>

      <div class="chapter-nav-footer">
        <button class="glass-btn" id="prev-chapter-btn">⬅️ 上一章</button>
        <button class="glass-btn glass-btn-primary" id="next-chapter-btn">下一章 ➡️</button>
      </div>
    </div>

    <!-- Floating Bubble for text selection -->
    <div id="selection-ai-bubble">
      <span>✨</span> 向 AI 深度提问选中文本
    </div>
  </main>

  <!-- Right AI Companion Panel -->
  <aside id="ai-panel">
    <div class="ai-panel-header">
      <div class="ai-panel-title">
        <span>🤖</span> AI 架构伴读 Copilot
      </div>
      <div style="display:flex; gap:6px;">
        <button class="glass-btn" id="clear-ai-chat-btn" title="清空对话" style="padding:2px 8px; font-size:11px;">清空</button>
        <button class="glass-btn" id="close-ai-panel-btn" style="padding:2px 6px;">✕</button>
      </div>
    </div>

    <div class="ai-chat-messages" id="ai-chat-messages">
      <div class="chat-bubble ai">
        👋 你好！我是《现代 AI Agent 运行时与 Harness 架构设计》专属伴读架构师。阅读中有任何模糊的协议概念、状态机设计或代码实现，随时向我提问或在正文中划词！
      </div>
    </div>

    <div class="ai-input-box">
      <div class="ai-input-wrapper">
        <textarea class="ai-textarea" id="ai-user-input" placeholder="输入问题或选中左侧文章文字深入探讨... (Cmd/Ctrl + Enter 发送)"></textarea>
        <div class="ai-controls-bar">
          <div class="ai-mode-pill" id="ai-status-pill">
            <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--brand-emerald);"></span>
            <span id="ai-endpoint-label">aih-server (免密直连)</span>
          </div>
          <button class="glass-btn glass-btn-primary" id="ai-send-btn">发送提问</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Fullscreen Image / SVG Lightbox Modal -->
  <div id="image-lightbox-modal">
    <div class="lightbox-close-hint">点击任意处或按 Esc 退出大图预览</div>
    <div id="lightbox-content-wrapper"></div>
  </div>

  <!-- Script Libraries -->
  <script src="diagram-components.js"></script>
  <script src="interactive-widgets.js"></script>
  <script src="book-data.js"></script>

  <script>
    // Initialize state
    let currentChapterIndex = parseInt(localStorage.getItem("aih_book_last_chapter") || "0", 10);
    const bookData = window.HARNESS_BOOK_DATA || [];
    let selectedQuoteText = "";
    let readChaptersSet = new Set(JSON.parse(localStorage.getItem("aih_book_read_chapters") || "[]"));

    let aiConfig = {
      mode: "aih_server",
      baseUrl: "/docs/harness-book/api/chat",
      apiKey: "",
      model: "claude-opus-5"
    };

    // Elements
    const chapterListEl = document.getElementById("chapter-list");
    const articleContentEl = document.getElementById("article-content");
    const currentChapterTitleEl = document.getElementById("current-chapter-title");
    const selectionBubble = document.getElementById("selection-ai-bubble");
    const aiPanel = document.getElementById("ai-panel");
    const aiChatMessages = document.getElementById("ai-chat-messages");
    const aiUserInput = document.getElementById("ai-user-input");
    const articleScroll = document.getElementById("article-scroll");
    const progressBar = document.getElementById("reading-progress-bar");
    const lightboxModal = document.getElementById("image-lightbox-modal");
    const lightboxWrapper = document.getElementById("lightbox-content-wrapper");

    // Render Navigation
    function renderNavigation(filterText = "") {
      chapterListEl.innerHTML = "";
      let currentPart = "";
      
      bookData.forEach((chapter, index) => {
        if (filterText && !chapter.title.toLowerCase().includes(filterText.toLowerCase()) && !chapter.content.toLowerCase().includes(filterText.toLowerCase())) {
          return;
        }

        if (chapter.part !== currentPart) {
          currentPart = chapter.part;
          const partHeader = document.createElement("div");
          partHeader.className = "part-group-header";
          partHeader.textContent = currentPart;
          chapterListEl.appendChild(partHeader);
        }

        const item = document.createElement("a");
        const isRead = readChaptersSet.has(chapter.id);
        item.className = `nav-item-btn ${index === currentChapterIndex ? "active" : ""} ${isRead ? "read-done" : ""}`;
        item.textContent = chapter.title;
        item.onclick = () => loadChapter(index);
        chapterListEl.appendChild(item);
      });
    }

    // Load Chapter Content
    function loadChapter(index) {
      if (index < 0 || index >= bookData.length) return;
      currentChapterIndex = index;
      const chapter = bookData[index];
      currentChapterTitleEl.textContent = chapter.title;

      // Mark as read
      readChaptersSet.add(chapter.id);
      localStorage.setItem("aih_book_read_chapters", JSON.stringify(Array.from(readChaptersSet)));
      localStorage.setItem("aih_book_last_chapter", index.toString());

      // Render Markdown
      articleContentEl.innerHTML = marked.parse(chapter.content);
      
      // Inject Code Block Wrappers & Copy Buttons
      attachCodeCopyButtons();

      // Syntax Highlight
      Prism.highlightAllUnder(articleContentEl);
      
      // Render Mermaid
      renderMermaidDiagrams();

      // Mount Interactive Simulation Widgets
      if (window.HarnessInteractiveWidgets) {
        window.HarnessInteractiveWidgets.mountWidgetsForChapter(chapter.id);
      }
      if (window.HarnessDiagramComponents) {
        window.HarnessDiagramComponents.mountAllDiagrams();
      }

      // Attach Lightbox
      attachLightbox();

      // Scroll to top
      articleScroll.scrollTop = 0;

      // Update Nav active
      renderNavigation(document.getElementById("chapter-search").value);

      // Update Footer buttons
      document.getElementById("prev-chapter-btn").style.visibility = index === 0 ? "hidden" : "visible";
      document.getElementById("next-chapter-btn").style.visibility = index === bookData.length - 1 ? "hidden" : "visible";
    }

    // Code Copy Buttons
    function attachCodeCopyButtons() {
      const pres = articleContentEl.querySelectorAll("pre");
      pres.forEach(pre => {
        const wrapper = document.createElement("div");
        wrapper.className = "code-block-wrapper";
        
        const header = document.createElement("div");
        header.className = "code-block-header";
        const lang = pre.querySelector("code")?.className.replace("language-", "") || "code";
        header.innerHTML = `<span class="code-lang-tag">${lang}</span><button class="code-copy-btn">复制代码</button>`;
        
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(header);
        wrapper.appendChild(pre);

        const btn = header.querySelector(".code-copy-btn");
        btn.onclick = () => {
          const code = pre.querySelector("code")?.textContent || pre.textContent;
          navigator.clipboard.writeText(code).then(() => {
            btn.textContent = "已复制!";
            setTimeout(() => btn.textContent = "复制代码", 2000);
          });
        };
      });
    }

    // Mermaid native rendering
    function renderMermaidDiagrams() {
      const codeBlocks = articleContentEl.querySelectorAll("code.language-mermaid");
      codeBlocks.forEach((codeBlock) => {
        const pre = codeBlock.parentElement;
        const rawMermaid = codeBlock.textContent;
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = rawMermaid;
        pre.parentNode.replaceChild(div, pre);
      });
      mermaid.init(undefined, ".mermaid");
    }

    // Lightbox Attachment
    function attachLightbox() {
      const heroImgs = articleContentEl.querySelectorAll(".ai-concept-hero img");
      heroImgs.forEach(img => {
        img.onclick = () => {
          lightboxWrapper.innerHTML = `<img src="${img.src}" alt="Preview" />`;
          lightboxModal.style.display = "flex";
        };
      });

      const svgWrappers = articleContentEl.querySelectorAll(".svg-diagram-wrapper");
      svgWrappers.forEach(sw => {
        sw.onclick = () => {
          lightboxWrapper.innerHTML = sw.innerHTML;
          lightboxModal.style.display = "flex";
        };
      });

      const mermaidDivs = articleContentEl.querySelectorAll(".mermaid");
      mermaidDivs.forEach(div => {
        div.onclick = () => {
          lightboxWrapper.innerHTML = div.innerHTML;
          lightboxModal.style.display = "flex";
        };
      });
    }

    lightboxModal.onclick = () => {
      lightboxModal.style.display = "none";
      lightboxWrapper.innerHTML = "";
    };

    // Reading Scroll Progress
    articleScroll.onscroll = () => {
      const total = articleScroll.scrollHeight - articleScroll.clientHeight;
      if (total > 0) {
        const pct = (articleScroll.scrollTop / total) * 100;
        progressBar.style.width = `${pct}%`;
      }
    };

    // Text Selection for Instant AI Answer
    document.addEventListener("selectionchange", () => {
      const selection = window.getSelection();
      const text = selection.toString().trim();
      if (text.length > 3 && text.length < 500) {
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        selectedQuoteText = text;
        selectionBubble.style.top = `${rect.bottom + window.scrollY + 8}px`;
        selectionBubble.style.left = `${rect.left + window.scrollX}px`;
        selectionBubble.style.display = "flex";
      } else {
        selectionBubble.style.display = "none";
      }
    });

    selectionBubble.onclick = () => {
      selectionBubble.style.display = "none";
      aiPanel.classList.remove("collapsed");
      aiUserInput.value = `请结合本章节【${bookData[currentChapterIndex].title}】的上下文，帮我深度通俗地解释以下概念：\\n\\n> "${selectedQuoteText}"`;
      triggerAISend();
    };

    // AI Chat & LLM Invocation
    async function triggerAISend() {
      const query = aiUserInput.value.trim();
      if (!query) return;

      appendChatBubble("user", query);
      aiUserInput.value = "";

      const aiBubble = appendChatBubble("ai", "Thinking & Generating...");
      const currentChapter = bookData[currentChapterIndex];
      const systemPrompt = `你是一位世界顶级的 AI Agent 架构师与《现代 AI Agent 运行时与 Harness 架构设计》的权威伴读顾问。
当前读者正在阅读章节：【${currentChapter.title}】（所属篇章：${currentChapter.part}）。
请结合本章节的底层架构知识，以严谨、源码级、生动透彻的语言解答读者的问题。如果涉及状态机、协议、数据结构或 ai_home 落地，请给出具体的解释或代码示例。`;

      try {
        const response = await fetch("/docs/harness-book/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-opus-5",
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: query }
            ],
            stream: true
          })
        });

        if (!response.ok) {
          aiBubble.innerHTML = `<span style="color:var(--brand-rose)">⚠️ 接入请求失败 (${response.status}): ${response.statusText}。</span>`;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullAnswer = "";
        aiBubble.innerHTML = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          const lines = chunk.split("\\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && !line.includes("[DONE]")) {
              try {
                const parsed = JSON.parse(line.slice(6));
                const delta = parsed.choices?.[0]?.delta?.content || "";
                fullAnswer += delta;
                aiBubble.innerHTML = marked.parse(fullAnswer);
              } catch (e) {}
            }
          }
          aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
        }
      } catch (err) {
        aiBubble.innerHTML = `<span style="color:var(--brand-rose)">⚠️ 网络连接异常: ${err.message}。</span>`;
      }
    }

    function appendChatBubble(role, initialHtml) {
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble ${role}`;
      bubble.innerHTML = initialHtml;
      aiChatMessages.appendChild(bubble);
      aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
      return bubble;
    }

    // UI Event Listeners
    document.getElementById("ai-send-btn").onclick = triggerAISend;
    aiUserInput.onkeydown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        triggerAISend();
      }
    };
    document.getElementById("clear-ai-chat-btn").onclick = () => {
      aiChatMessages.innerHTML = "";
      appendChatBubble("ai", "对话已清空。有什么可以帮助你的？");
    };
    document.getElementById("toggle-ai-panel-btn").onclick = () => {
      aiPanel.classList.toggle("collapsed");
    };
    document.getElementById("close-ai-panel-btn").onclick = () => {
      aiPanel.classList.add("collapsed");
    };
    document.getElementById("toggle-sidebar-btn").onclick = () => {
      const sidebar = document.getElementById("sidebar");
      sidebar.style.display = sidebar.style.display === "none" ? "flex" : "none";
    };
    document.getElementById("prev-chapter-btn").onclick = () => loadChapter(currentChapterIndex - 1);
    document.getElementById("next-chapter-btn").onclick = () => loadChapter(currentChapterIndex + 1);

    // Keyboard Shortcuts
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        document.getElementById("chapter-search").focus();
      }
      if (e.key === "Escape") {
        selectionBubble.style.display = "none";
        lightboxModal.style.display = "none";
      }
      if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
        if (e.key === "[") loadChapter(currentChapterIndex - 1);
        if (e.key === "]") loadChapter(currentChapterIndex + 1);
      }
    });

    // Search filter
    document.getElementById("chapter-search").oninput = (e) => {
      renderNavigation(e.target.value);
    };

    // Theme Toggle
    document.getElementById("theme-toggle").onclick = () => {
      const current = document.documentElement.getAttribute("data-theme");
      const target = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", target);
    };

    // Mermaid init configuration
    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      themeVariables: {
        darkMode: true,
        background: "#050608",
        primaryColor: "#1f3b5c",
        primaryTextColor: "#f0f6fc",
        primaryBorderColor: "#58a6ff",
        lineColor: "#8b949e",
        secondaryColor: "#21262d",
        tertiaryColor: "#161b22"
      }
    });

    // Initial Load
    renderNavigation();
    loadChapter(currentChapterIndex);
  </script>
</body>
</html>

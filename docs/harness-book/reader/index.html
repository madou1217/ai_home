<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现代 AI Agent 运行时与 Harness 架构设计 - 沉浸式 AI 电子书</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Markdown & Syntax Highlight & Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/prism-themes@1.9.0/themes/prism-one-dark.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>

  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-bright: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79c0ff;
      --accent-bg: rgba(56, 139, 253, 0.15);
      --success: #3fb950;
      --warning: #d29922;
      --danger: #f85149;
      --sidebar-width: 330px;
      --ai-panel-width: 440px;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "Fira Code", monospace;
    }

    [data-theme="light"] {
      --bg-primary: #ffffff;
      --bg-secondary: #f6f8fa;
      --bg-tertiary: #eaeef2;
      --border-color: #d0d7de;
      --text-main: #24292f;
      --text-bright: #0969da;
      --text-muted: #57606a;
      --accent: #0969da;
      --accent-hover: #218bff;
      --accent-bg: rgba(9, 105, 218, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Top Reading Progress Bar */
    #reading-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--success));
      width: 0%;
      z-index: 1000;
      transition: width 0.1s ease;
    }

    /* Left Sidebar */
    #sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-search {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      position: relative;
    }
    .nav-search input {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 10px 7px 28px;
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }
    .nav-search .search-icon {
      position: absolute;
      left: 24px;
      top: 17px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 8px;
    }
    .part-group-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 12px 12px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--text-main);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
      margin-bottom: 2px;
      line-height: 1.45;
      position: relative;
    }
    .nav-item:hover {
      background-color: var(--bg-tertiary);
      color: var(--text-bright);
    }
    .nav-item.active {
      background-color: var(--accent-bg);
      color: var(--accent);
      font-weight: 600;
      border-left: 3px solid var(--accent);
    }
    .nav-item.read-done::after {
      content: "✓";
      position: absolute;
      right: 8px;
      font-size: 10px;
      color: var(--success);
      font-weight: 700;
    }

    /* Main Article Container */
    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .top-bar {
      height: 52px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      user-select: none;
    }
    .btn:hover {
      background: var(--border-color);
      color: var(--text-bright);
    }
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .article-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 40px 60px 120px;
      scroll-behavior: smooth;
      position: relative;
    }
    .markdown-body {
      max-width: 920px;
      margin: 0 auto;
      font-size: 15px;
      line-height: 1.8;
    }
    .markdown-body h1 {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .markdown-body h2 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-bright);
      margin: 36px 0 16px;
      border-bottom: 1px solid rgba(48, 54, 61, 0.5);
      padding-bottom: 8px;
    }
    .markdown-body h3 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-bright);
      margin: 26px 0 12px;
    }
    .markdown-body p, .markdown-body ul, .markdown-body ol {
      margin-bottom: 18px;
    }
    .markdown-body blockquote {
      border-left: 4px solid var(--accent);
      padding: 12px 18px;
      background-color: var(--accent-bg);
      border-radius: 0 6px 6px 0;
      margin-bottom: 24px;
      color: var(--text-bright);
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 24px 0;
      font-size: 13px;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 10px 14px;
      text-align: left;
    }
    .markdown-body th {
      background-color: var(--bg-secondary);
      color: var(--text-bright);
      font-weight: 600;
    }
    .markdown-body code:not([class*="language-"]) {
      background-color: var(--bg-tertiary);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent-hover);
    }
    .code-block-wrapper {
      position: relative;
      margin: 20px 0;
    }
    .code-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(33, 38, 45, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-muted);
      font-size: 11px;
      padding: 3px 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .code-copy-btn:hover {
      color: var(--text-bright);
      background: var(--bg-tertiary);
    }
    .markdown-body pre {
      background-color: #161b22 !important;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
    }
    .chapter-nav-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
    }

    /* Text Selection Floating Ask-AI Bubble */
    #selection-ai-bubble {
      position: absolute;
      display: none;
      z-index: 100;
      background: var(--bg-secondary);
      border: 1px solid var(--accent);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border-radius: 24px;
      padding: 6px 14px;
      color: var(--text-bright);
      font-size: 12px;
      cursor: pointer;
      align-items: center;
      gap: 8px;
      animation: popIn 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #selection-ai-bubble:hover {
      background: var(--accent);
      color: #fff;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Right AI Companion Panel */
    #ai-panel {
      width: var(--ai-panel-width);
      background-color: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }
    #ai-panel.collapsed {
      width: 0;
      border-left: none;
      display: none;
    }
    .ai-panel-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ai-panel-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ai-chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat-bubble {
      max-width: 92%;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }
    .chat-bubble.user {
      align-self: flex-end;
      background-color: var(--accent);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .chat-bubble.ai {
      align-self: flex-start;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
    }
    .chat-bubble.ai .thinking-box {
      background: rgba(0,0,0,0.25);
      border-left: 3px solid var(--warning);
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
      border-radius: 4px;
    }
    .ai-input-box {
      padding: 14px;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-secondary);
    }
    .ai-input-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ai-textarea {
      width: 100%;
      height: 75px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 12.5px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    .ai-textarea:focus {
      border-color: var(--accent);
    }
    .ai-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ai-mode-pill {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Modal for BYOK Settings */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }
    .modal-card {
      width: 480px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
    }
    .modal-card h3 {
      color: var(--text-bright);
      margin-bottom: 16px;
      font-size: 16px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input, .form-group select {
      width: 100%;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text-bright);
      font-size: 13px;
      outline: none;
    }
  
    /* Interactive Simulation Widgets Styles */
    .interactive-card {
      background: linear-gradient(145deg, var(--bg-secondary), var(--bg-tertiary));
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 20px;
      margin: 32px 0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 8px currentColor;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .card-controls {
      display: flex;
      gap: 8px;
    }
    .sim-btn {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
    }
    .sim-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--text-bright);
    }
    .sim-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .sim-btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .sim-btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    /* FSM Track */
    .fsm-nodes-track {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 4px 20px;
    }
    .fsm-node {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-muted);
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .fsm-node.active {
      border-color: var(--node-color);
      box-shadow: 0 0 16px var(--node-color);
      color: var(--text-bright);
      transform: translateY(-2px);
    }
    .fsm-node.passed {
      border-color: var(--success);
      color: var(--text-main);
    }
    .node-arrow {
      color: var(--border-color);
      font-size: 12px;
      margin-left: 4px;
    }
    .fsm-inspector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
    }
    .inspector-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
    }
    .inspector-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .inspector-terminal {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      color: #79c0ff;
      background: #000;
      padding: 10px;
      border-radius: 6px;
      margin-top: 6px;
    }
    .inspector-payload {
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.5;
      color: #ff7b72;
      background: #000;
      padding: 10px;
      border-radius: 6px;
      height: 140px;
      overflow-y: auto;
    }

    /* Watermark Bar */
    .watermark-meter-wrapper {
      margin: 16px 0 24px;
    }
    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 8px;
    }
    .meter-bar-bg {
      height: 18px;
      background: var(--bg-primary);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
    }
    .meter-bar-fill {
      height: 100%;
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 10px;
    }
    .watermark-marker {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 2px;
      background: var(--danger);
      font-size: 10px;
      color: var(--danger);
      padding-left: 4px;
      font-weight: 700;
    }

    /* Radix Tree */
    .radix-tree-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin: 20px 0;
    }
    .tree-node {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .node-chip {
      padding: 8px 16px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }
    .node-chip.static { background: #1f3b5c; color: #58a6ff; border: 1px solid #58a6ff; }
    .node-chip.mid { background: #3b3117; color: #d29922; border: 1px solid #d29922; }
    .node-chip.active { background: #2e1f42; color: #bc8cff; border: 1px solid #bc8cff; }
    .cache-badge {
      font-size: 11px;
      background: rgba(63, 185, 80, 0.15);
      color: var(--success);
      border: 1px solid var(--success);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .cache-badge.dynamic {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }
    .tree-line {
      width: 2px;
      height: 12px;
      background: var(--border-color);
    }
    .cache-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .stat-pill {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-num {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-hover);
      font-family: var(--font-mono);
    }
    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Dual-Parity Bridge Grid */
    .dual-bridge-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 16px;
      align-items: center;
      margin-top: 14px;
    }
    .client-pane {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      min-height: 180px;
    }
    .pane-header {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-bright);
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }
    .terminal-body {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
    }
    .term-warn { color: #d29922; font-weight: 600; }
    .term-cmd { color: #58a6ff; }
    .term-reason { color: #8b949e; font-size: 11px; }
    .term-prompt { color: #f0f6fc; margin-top: 8px; }
    .key-hint {
      background: #30363d;
      color: #fff;
      padding: 1px 6px;
      border-radius: 4px;
      border: 1px solid #8b949e;
      cursor: pointer;
    }
    .term-cursor { animation: blink 1s infinite; }

    .tech-card.blue { border-left: 3px solid var(--accent); }
    .tech-card.purple { border-left: 3px solid #bc8cff; }
    .tech-card.green { border-left: 3px solid var(--success); }
    .tech-card.orange { border-left: 3px solid var(--warning); }
    .tech-card.red { border-left: 3px solid var(--danger); }
    .tech-card.cyan { border-left: 3px solid #39c5bb; }

    .card-label { font-size: 12px; font-weight: 700; color: var(--text-bright); display: flex; align-items: center; gap: 6px; }
    .card-sub { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono); }

    /* 连接流动箭头 */
    .flow-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 0;
    }
    .flow-line {
      flex: 1;
      height: 1px;
      background: dashed 1px var(--border-color);
    }

    /* 左右分栏流 */
    .split-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .col-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
    }
    .col-title { font-size: 12.5px; font-weight: 700; color: var(--text-bright); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

  </style>
</head>
<body>

  <!-- Top Reading Progress Indicator -->
  <div id="reading-progress-bar"></div>

  <!-- Left Chapter Navigation -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span>📖</span> Agent Harness 电子书
      </div>
      <button class="btn" id="theme-toggle" title="切换主题">🌓</button>
    </div>
    <div class="nav-search">
      <span class="search-icon">🔍</span>
      <input type="text" id="chapter-search" placeholder="搜索章节或知识点... (Cmd+K)">
    </div>
    <div class="nav-list" id="chapter-list">
      <!-- Injected via JavaScript -->
    </div>
  </aside>

  <!-- Main Article Area -->
  <main id="main-container">
    <header class="top-bar">
      <div style="display:flex; align-items:center; gap: 12px; overflow:hidden;">
        <button class="btn" id="toggle-sidebar-btn" title="折叠/展开目录">☰ 目录</button>
        <span id="current-chapter-title" style="font-size:13px; font-weight:600; color:var(--text-bright); white-space:nowrap; text-overflow:ellipsis; overflow:hidden;">加载中...</span>
      </div>
      <div class="top-actions">
        <button class="btn" id="byok-settings-btn">⚙️ AI 设置 (BYOK / aih)</button>
        <button class="btn btn-primary" id="toggle-ai-panel-btn">✨ AI 伴读助手</button>
      </div>
    </header>

    <div class="article-scroll-area" id="article-scroll">
      <article class="markdown-body" id="article-content">
        <!-- Injected via JavaScript -->
      </article>

      <div class="chapter-nav-footer">
        <button class="btn" id="prev-chapter-btn">⬅️ 上一章</button>
        <button class="btn btn-primary" id="next-chapter-btn">下一章 ➡️</button>
      </div>
    </div>

    <!-- Floating Bubble for text selection -->
    <div id="selection-ai-bubble">
      <span>✨</span> 向 AI 深度提问选中文本
    </div>
  </main>

  <!-- Right AI Companion Panel -->
  <aside id="ai-panel">
    <div class="ai-panel-header">
      <div class="ai-panel-title">
        <span>🤖</span> AI 架构伴读 Copilot
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn" id="clear-ai-chat-btn" title="清空对话" style="padding:2px 8px; font-size:11px;">清空</button>
        <button class="btn" id="close-ai-panel-btn" style="padding:2px 6px;">✕</button>
      </div>
    </div>

    <div class="ai-chat-messages" id="ai-chat-messages">
      <div class="chat-bubble ai">
        👋 你好！我是你的《现代 AI Agent 运行时与 Harness 架构设计》专属伴读架构师。阅读中有任何模糊的协议概念、状态机设计或代码实现，随时向我提问或在正文中划词！
      </div>
    </div>

    <div class="ai-input-box">
      <div class="ai-input-wrapper">
        <textarea class="ai-textarea" id="ai-user-input" placeholder="输入问题或选中左侧文章文字深入探讨... (Cmd/Ctrl + Enter 发送)"></textarea>
        <div class="ai-controls-bar">
          <div class="ai-mode-pill" id="ai-status-pill">
            <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--success);"></span>
            <span id="ai-endpoint-label">aih-server (免配)</span>
          </div>
          <button class="btn btn-primary" id="ai-send-btn">发送提问</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- BYOK Settings Modal -->
  <div class="modal-overlay" id="byok-modal">
    <div class="modal-card">
      <h3>⚙️ AI 服务接入设置</h3>
      <div class="form-group">
        <label>接入模式 (Provider Mode)</label>
        <select id="setting-provider-mode">
          <option value="aih_server">本地 aih-server 网关 (默认推荐，无需配置 Key)</option>
          <option value="custom_byok">自定义 BYOK (自定义 OpenAI / Claude / DeepSeek Key)</option>
        </select>
      </div>
      <div id="byok-fields" style="display:none;">
        <div class="form-group">
          <label>Base URL 端点</label>
          <input type="text" id="setting-base-url" placeholder="https://api.openai.com/v1 或中转网关地址">
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input type="password" id="setting-api-key" placeholder="sk-...">
        </div>
        <div class="form-group">
          <label>Model 模型名称</label>
          <input type="text" id="setting-model-name" placeholder="claude-opus-5 / gpt-5.5 / deepseek-chat">
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:20px;">
        <button class="btn" id="modal-cancel-btn">取消</button>
        <button class="btn btn-primary" id="modal-save-btn">保存配置</button>
      </div>
    </div>
  </div>

  <script src="interactive-widgets.js"></script>
  <!-- Book Data Loader -->
  <script src="book-data.js"></script>

  <script>
    // Initialize state
    let currentChapterIndex = parseInt(localStorage.getItem("aih_book_last_chapter") || "0", 10);
    const bookData = window.HARNESS_BOOK_DATA || [];
    let selectedQuoteText = "";
    let readChaptersSet = new Set(JSON.parse(localStorage.getItem("aih_book_read_chapters") || "[]"));

    // Settings config
    let aiConfig = JSON.parse(localStorage.getItem("aih_book_ai_config") || JSON.stringify({
      mode: "aih_server",
      baseUrl: "/docs/harness-book/api/chat",
      apiKey: "",
      model: "claude-opus-5"
    }));

    // Elements
    const chapterListEl = document.getElementById("chapter-list");
    const articleContentEl = document.getElementById("article-content");
    const currentChapterTitleEl = document.getElementById("current-chapter-title");
    const selectionBubble = document.getElementById("selection-ai-bubble");
    const aiPanel = document.getElementById("ai-panel");
    const aiChatMessages = document.getElementById("ai-chat-messages");
    const aiUserInput = document.getElementById("ai-user-input");
    const byokModal = document.getElementById("byok-modal");
    const byokFields = document.getElementById("byok-fields");
    const providerModeSelect = document.getElementById("setting-provider-mode");
    const articleScroll = document.getElementById("article-scroll");
    const progressBar = document.getElementById("reading-progress-bar");

    // Render Navigation
    function renderNavigation(filterText = "") {
      chapterListEl.innerHTML = "";
      let currentPart = "";
      
      bookData.forEach((chapter, index) => {
        if (filterText && !chapter.title.toLowerCase().includes(filterText.toLowerCase()) && !chapter.content.toLowerCase().includes(filterText.toLowerCase())) {
          return;
        }

        if (chapter.part !== currentPart) {
          currentPart = chapter.part;
          const partHeader = document.createElement("div");
          partHeader.className = "part-group-title";
          partHeader.textContent = currentPart;
          chapterListEl.appendChild(partHeader);
        }

        const item = document.createElement("a");
        const isRead = readChaptersSet.has(chapter.id);
        item.className = `nav-item ${index === currentChapterIndex ? "active" : ""} ${isRead ? "read-done" : ""}`;
        item.textContent = chapter.title;
        item.onclick = () => loadChapter(index);
        chapterListEl.appendChild(item);
      });
    }

    // Load Chapter Content
    function loadChapter(index) {
      if (index < 0 || index >= bookData.length) return;
      currentChapterIndex = index;
      const chapter = bookData[index];
      currentChapterTitleEl.textContent = chapter.title;

      // Mark as read
      readChaptersSet.add(chapter.id);
      localStorage.setItem("aih_book_read_chapters", JSON.stringify(Array.from(readChaptersSet)));
      localStorage.setItem("aih_book_last_chapter", index.toString());

      // Render Markdown
      articleContentEl.innerHTML = marked.parse(chapter.content);
      
      // Inject Code Block Copy Buttons
      attachCodeCopyButtons();

      // Syntax Highlight
      Prism.highlightAllUnder(articleContentEl);
      
      // Render Mermaid Diagrams natively
      renderMermaidDiagrams();

      // Mount Interactive Visual Simulation Widgets
      if (window.HarnessInteractiveWidgets) {
        window.HarnessInteractiveWidgets.mountWidgetsForChapter(chapter.id);
      }

      // Scroll to top
      articleScroll.scrollTop = 0;

      // Update Nav active
      renderNavigation(document.getElementById("chapter-search").value);

      // Update Footer buttons
      document.getElementById("prev-chapter-btn").style.visibility = index === 0 ? "hidden" : "visible";
      document.getElementById("next-chapter-btn").style.visibility = index === bookData.length - 1 ? "hidden" : "visible";
    }

    // Code Copy Buttons
    function attachCodeCopyButtons() {
      const pres = articleContentEl.querySelectorAll("pre");
      pres.forEach(pre => {
        const wrapper = document.createElement("div");
        wrapper.className = "code-block-wrapper";
        pre.parentNode.insertBefore(wrapper, pre);
        wrapper.appendChild(pre);

        const btn = document.createElement("button");
        btn.className = "code-copy-btn";
        btn.textContent = "复制";
        btn.onclick = () => {
          const code = pre.querySelector("code")?.textContent || pre.textContent;
          navigator.clipboard.writeText(code).then(() => {
            btn.textContent = "已复制!";
            setTimeout(() => btn.textContent = "复制", 2000);
          });
        };
        wrapper.appendChild(btn);
      });
    }

    // Mermaid native rendering
    function renderMermaidDiagrams() {
      const codeBlocks = articleContentEl.querySelectorAll("code.language-mermaid");
      codeBlocks.forEach((codeBlock) => {
        const pre = codeBlock.parentElement;
        const rawMermaid = codeBlock.textContent;
        const div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = rawMermaid;
        pre.parentNode.replaceChild(div, pre);
      });
      mermaid.init(undefined, ".mermaid");
    }

    // Reading Scroll Progress
    articleScroll.onscroll = () => {
      const total = articleScroll.scrollHeight - articleScroll.clientHeight;
      if (total > 0) {
        const pct = (articleScroll.scrollTop / total) * 100;
        progressBar.style.width = `${pct}%`;
      }
    };

    // Text Selection for Instant AI Answer
    document.addEventListener("selectionchange", () => {
      const selection = window.getSelection();
      const text = selection.toString().trim();
      if (text.length > 3 && text.length < 500) {
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        selectedQuoteText = text;
        selectionBubble.style.top = `${rect.bottom + window.scrollY + 8}px`;
        selectionBubble.style.left = `${rect.left + window.scrollX}px`;
        selectionBubble.style.display = "flex";
      } else {
        selectionBubble.style.display = "none";
      }
    });

    selectionBubble.onclick = () => {
      selectionBubble.style.display = "none";
      aiPanel.classList.remove("collapsed");
      aiUserInput.value = `请结合本章节【${bookData[currentChapterIndex].title}】的上下文，帮我深度通俗地解释以下概念：

> "${selectedQuoteText}"`;
      triggerAISend();
    };

    // AI Chat & LLM Invocation
    async function triggerAISend() {
      const query = aiUserInput.value.trim();
      if (!query) return;

      // Append User message
      appendChatBubble("user", query);
      aiUserInput.value = "";

      // Append AI placeholder
      const aiBubble = appendChatBubble("ai", "Thinking & Generating...");

      const currentChapter = bookData[currentChapterIndex];
      const systemPrompt = `你是一位世界顶级的 AI Agent 架构师与《现代 AI Agent 运行时与 Harness 架构设计》的权威伴读顾问。
当前读者正在阅读章节：【${currentChapter.title}】（所属篇章：${currentChapter.part}）。
请结合本章节的底层架构知识，以严谨、源码级、生动透彻的语言解答读者的问题。如果涉及状态机、协议、数据结构或 ai_home 落地，请给出具体的解释或代码示例。`;

      try {
        let endpoint = (aiConfig.mode === "aih_server" || !aiConfig.mode) ? "/docs/harness-book/api/chat" : `${aiConfig.baseUrl}/chat/completions`;
        let headers = { "Content-Type": "application/json" };
        if (aiConfig.apiKey) {
          headers["Authorization"] = `Bearer ${aiConfig.apiKey}`;
        }

        const response = await fetch(endpoint, {
          method: "POST",
          headers,
          body: JSON.stringify({
            model: aiConfig.model || "claude-opus-5",
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: query }
            ],
            stream: true
          })
        });

        if (!response.ok) {
          aiBubble.innerHTML = `<span style="color:var(--danger)">⚠️ 接入请求失败 (${response.status}): ${response.statusText}。请检查 aih 服务或点击右上角 BYOK 设置。</span>`;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullAnswer = "";
        aiBubble.innerHTML = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          const lines = chunk.split("\n");
          for (const line of lines) {
            if (line.startsWith("data: ") && !line.includes("[DONE]")) {
              try {
                const parsed = JSON.parse(line.slice(6));
                const delta = parsed.choices?.[0]?.delta?.content || "";
                fullAnswer += delta;
                aiBubble.innerHTML = marked.parse(fullAnswer);
              } catch (e) {}
            }
          }
          aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
        }
      } catch (err) {
        aiBubble.innerHTML = `<span style="color:var(--danger)">⚠️ 网络连接异常: ${err.message}。如使用 aih 本地服务，请确保已启动 \`aih serve\`。</span>`;
      }
    }

    function appendChatBubble(role, initialHtml) {
      const bubble = document.createElement("div");
      bubble.className = `chat-bubble ${role}`;
      bubble.innerHTML = initialHtml;
      aiChatMessages.appendChild(bubble);
      aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
      return bubble;
    }

    // UI Event Listeners
    document.getElementById("ai-send-btn").onclick = triggerAISend;
    aiUserInput.onkeydown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        triggerAISend();
      }
    };

    document.getElementById("clear-ai-chat-btn").onclick = () => {
      aiChatMessages.innerHTML = "";
      appendChatBubble("ai", "对话已清空。有什么可以帮助你的？");
    };

    document.getElementById("toggle-ai-panel-btn").onclick = () => {
      aiPanel.classList.toggle("collapsed");
    };
    document.getElementById("close-ai-panel-btn").onclick = () => {
      aiPanel.classList.add("collapsed");
    };
    document.getElementById("toggle-sidebar-btn").onclick = () => {
      const sidebar = document.getElementById("sidebar");
      sidebar.style.display = sidebar.style.display === "none" ? "flex" : "none";
    };

    document.getElementById("prev-chapter-btn").onclick = () => loadChapter(currentChapterIndex - 1);
    document.getElementById("next-chapter-btn").onclick = () => loadChapter(currentChapterIndex + 1);

    // Keyboard Shortcuts
    document.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "k") {
        e.preventDefault();
        document.getElementById("chapter-search").focus();
      }
      if (e.key === "Escape") {
        byokModal.style.display = "none";
        selectionBubble.style.display = "none";
      }
      if (e.target.tagName !== "INPUT" && e.target.tagName !== "TEXTAREA") {
        if (e.key === "[") loadChapter(currentChapterIndex - 1);
        if (e.key === "]") loadChapter(currentChapterIndex + 1);
      }
    });

    // BYOK Modal Handlers
    document.getElementById("byok-settings-btn").onclick = () => {
      providerModeSelect.value = aiConfig.mode;
      document.getElementById("setting-base-url").value = aiConfig.baseUrl;
      document.getElementById("setting-api-key").value = aiConfig.apiKey;
      document.getElementById("setting-model-name").value = aiConfig.model;
      byokFields.style.display = aiConfig.mode === "custom_byok" ? "block" : "none";
      byokModal.style.display = "flex";
    };
    providerModeSelect.onchange = () => {
      byokFields.style.display = providerModeSelect.value === "custom_byok" ? "block" : "none";
    };
    document.getElementById("modal-cancel-btn").onclick = () => {
      byokModal.style.display = "none";
    };
    document.getElementById("modal-save-btn").onclick = () => {
      aiConfig.mode = providerModeSelect.value;
      aiConfig.baseUrl = document.getElementById("setting-base-url").value.trim();
      aiConfig.apiKey = document.getElementById("setting-api-key").value.trim();
      aiConfig.model = document.getElementById("setting-model-name").value.trim() || "claude-opus-5";
      localStorage.setItem("aih_book_ai_config", JSON.stringify(aiConfig));
      document.getElementById("ai-endpoint-label").textContent = aiConfig.mode === "aih_server" ? "aih-server (免配)" : `BYOK (${aiConfig.model})`;
      byokModal.style.display = "none";
    };

    // Search filter
    document.getElementById("chapter-search").oninput = (e) => {
      renderNavigation(e.target.value);
    };

    // Theme Toggle
    document.getElementById("theme-toggle").onclick = () => {
      const current = document.documentElement.getAttribute("data-theme");
      const target = current === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", target);
    };

    // Initial Load
    renderNavigation();
    loadChapter(currentChapterIndex);
  </script>
</body>
</html>

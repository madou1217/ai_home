<style>

    color-scheme: light dark;
    --bg: #ffffff;

  @media (prefers-color-scheme: dark) {

      --bg: #0f1115;
      --bg-subtle: #161920;
      --bg-hover: #1e232d;
      --bg-header: rgba(15, 17, 21, 0.92);
      --text: #e6e8ec;

      --kbd-border: #2d3340;

      --toast-text: #0f1115;

  *, *::before, *::after {

  html {

    background: var(--bg);

  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Header */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 30;
    min-height: var(--header-h);
    background: var(--bg-header);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

  .header-inner {

    margin: 0 auto;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .site-title {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 460px;
  }

  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    color: var(--text-muted);
    pointer-events: none;
  }

  .search-input {
    width: 100%;
    height: 36px;
    padding: 0 58px 0 34px;
    font: inherit;
    font-size: 0.9rem;
    color: var(--text);
    background: var(--bg-subtle);
    border: 1px solid var(--border);

  .search-input::placeholder {

  .search-input:focus {
    background: var(--bg);
    border-color: var(--accent);
    outline: none;
    box-shadow: 0 0 0 2px var(--accent-soft);
  }

  .search-input:focus-visible {

  }

  .search-kbd {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    padding: 1px 6px;
    font-family: var(--font-mono);
    font-size: 0.72rem;
    line-height: 1.4;
    color: var(--text-muted);
    background: var(--kbd-bg);
    border: 1px solid var(--kbd-border);
    border-radius: 4px;
    pointer-events: none;

  .search-clear {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: none;
    align-items: center;
    justify-content: center;

    font-size: 0.85rem;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;

  /* Layout */
  .layout {
    flex: 1;
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
    gap: 36px;
    align-items: start;

    position: sticky;
    top: calc(var(--header-h) + 24px);
    max-height: calc(100vh - var(--header-h) - 48px);

  .nav-list {
    list-style: none;
    margin: 0;
    padding: 0;

    flex-direction: column;

  .nav-link {

  .nav-link:hover {

  .nav-link.is-active {

  .nav-label {

  .nav-count {

  .nav-link.is-active .nav-count {

  /* Content */

    min-width: 0;

  .group-section {

  .group-heading {
    display: flex;

  .cmd-row {
    display: grid;

  .cmd-path-cell {

  .cmd-path:hover .copy-icon,
  .cmd-path:focus-visible .copy-icon,

    opacity: 1;
    color: var(--accent);

  .cmd-desc {
    color: var(--text-secondary);

  .cmd-meta {

  .flag-tag {
    display: inline-block;

  .alias-group {

  .alias-item {

  /* Empty state */
  .empty-state {
    padding: 56px 16px;

  .empty-state p {
    margin: 0 0 12px;

  .empty-reset {
    padding: 6px 14px;

  .empty-reset:hover {

  /* Footer */
  .site-footer {
    margin-top: auto;
    border-top: 1px solid var(--border);
    background: var(--bg-subtle);
  }

  .footer-inner {
    max-width: 1240px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 20px;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .footer-meta {
    font-family: var(--font-mono);
    font-size: 0.78rem;

  /* Copy Toast */
  .toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 50;
    max-width: min(360px, calc(100vw - 40px));

    border-radius: 7px;
    background: var(--toast-bg);
    color: var(--toast-text);
    font-size: 0.84rem;
    line-height: 1.4;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    transition: opacity 0.16s ease, transform 0.16s ease;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .toast.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Responsive: < 1024px */
  @media (max-width: 1023px) {
    .header-inner {
      padding: 10px 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .site-title {

    .entry-count {

    .search-wrap {
      order: 3;
      flex: 1 0 100%;

    .layout {
      display: block;
      padding: 0 16px 24px;

    .sidebar {
      position: sticky;
      top: var(--header-h-mobile, 102px);
      z-index: 20;
      max-height: none;
      margin: 0 -16px 20px;
      padding: 8px 16px;
      background: var(--bg-header);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      overflow-x: auto;

    .nav-list {
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 6px;
    }

    .nav-item {
      flex-shrink: 0;
    }

    .nav-link {
      padding: 5px 10px;
      white-space: nowrap;
      background: var(--bg-subtle);
    }

    .nav-link.is-active {
      background: var(--accent-soft);
    }

    .group-section {
      scroll-margin-top: calc(var(--header-h-mobile, 102px) + 56px);
    }

    .footer-inner {
      padding: 16px;
    }
  }

  @media (max-width: 640px) {
    .cmd-row {
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .cmd-item {
      padding: 12px 2px;
    }
  }
</style>

<body>
  <header class="site-header" id="site-header">

<script>
(function () {
  "use strict";

  const AIH_ENTRIES = __AIH_MANIFEST__;

  var entries = Array.isArray(AIH_ENTRIES) ? AIH_ENTRIES : [];
  var headerEl = document.getElementById("site-header");
  var searchWrapEl = document.getElementById("search-wrap");
  var searchInputEl = document.getElementById("search-input");
  var searchClearEl = document.getElementById("search-clear");
  var countEl = document.getElementById("entry-count");
  var navListEl = document.getElementById("nav-list");
  var mainEl = document.getElementById("main-content");
  var toastEl = document.getElementById("toast");

  var toastTimer = null;
  var activeGroupId = "";
  var sectionElements = [];

  function normalizeText(val) {
    return val == null ? "" : String(val);
  }

  function normalizeList(val) {
    return Array.isArray(val) ? val.map(normalizeText) : [];
  }

  function updateHeaderHeightVar() {
    if (!headerEl) return;
    document.documentElement.style.setProperty("--header-h-mobile", headerEl.offsetHeight + "px");
  }

  function createCopyIcon() {
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "copy-icon");
    svg.setAttribute("viewBox", "0 0 16 16");
    svg.setAttribute("fill", "none");
    svg.setAttribute("stroke", "currentColor");
    svg.setAttribute("stroke-width", "1.4");
    svg.setAttribute("aria-hidden", "true");

    var rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("x", "5.5");
    rect.setAttribute("y", "5.5");
    rect.setAttribute("width", "8");
    rect.setAttribute("height", "8");
    rect.setAttribute("rx", "1.4");

    var path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", "M3.5 10.5H3A1.5 1.5 0 0 1 1.5 9V3A1.5 1.5 0 0 1 3 1.5H9A1.5 1.5 0 0 1 10.5 3V3.5");

    svg.appendChild(rect);
    svg.appendChild(path);
    return svg;
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("is-visible");
    if (toastTimer) {
      clearTimeout(toastTimer);
    }
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("is-visible");
    }, 1800);
  }

  function fallbackCopy(text) {
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.setAttribute("readonly", "");
    textarea.style.position = "fixed";
    textarea.style.top = "-9999px";
    textarea.style.left = "-9999px";
    document.body.appendChild(textarea);
    textarea.select();
    var ok = false;
    try {
      ok = document.execCommand("copy");
    } catch (e) {
      ok = false;
    }
    document.body.removeChild(textarea);
    return ok;
  }

  function copyPath(text, buttonEl) {
    function onSuccess() {
      buttonEl.classList.add("is-copied");
      setTimeout(function () {
        buttonEl.classList.remove("is-copied");
      }, 900);
      showToast("已复制：" + text);
    }

    function onFailure() {
      showToast("复制失败，请手动复制");
    }

    if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
      navigator.clipboard.writeText(text).then(onSuccess, function () {
        if (fallbackCopy(text)) {
          onSuccess();
        } else {
          onFailure();
        }
      });
    } else if (fallbackCopy(text)) {
      onSuccess();
    } else {
      onFailure();
    }
  }

  function matchesQuery(entry, tokens) {
    if (!tokens.length) return true;
    var haystack = [
      normalizeText(entry.path),
      normalizeText(entry.description),
      normalizeText(entry.group),
      normalizeList(entry.flags).join(" "),
      normalizeList(entry.alias).join(" ")
    ].join(" ").toLowerCase();

    for (var i = 0; i < tokens.length; i++) {
      if (haystack.indexOf(tokens[i]) === -1) {
        return false;
      }
    }
    return true;
  }

  function buildGroups(list) {
    var groups = [];
    var groupMap = Object.create(null);

    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      var groupName = normalizeText(item.group) || "未分组";
      if (!groupMap[groupName]) {
        var groupObj = {
          id: "group-" + groups.length,
          name: groupName,
          items: []
        };
        groupMap[groupName] = groupObj;
        groups.push(groupObj);
      }
      groupMap[groupName].items.push(item);
    }

    return groups;
  }

  function setActiveNav(id) {
    if (!id || activeGroupId === id) return;
    activeGroupId = id;
    var links = navListEl.querySelectorAll(".nav-link");
    for (var i = 0; i < links.length; i++) {
      var link = links[i];
      var isMatch = link.getAttribute("data-group-id") === id;
      link.classList.toggle("is-active", isMatch);
      if (isMatch) {
        link.setAttribute("aria-current", "true");
      } else {
        link.removeAttribute("aria-current");
      }
    }
  }

  function updateActiveOnScroll() {
    if (!sectionElements.length) return;
    var offset = (window.innerWidth < 1024 ? (headerEl.offsetHeight + 68) : 96);
    var currentId = sectionElements[0].id;
    for (var i = 0; i < sectionElements.length; i++) {
      var rect = sectionElements[i].getBoundingClientRect();
      if (rect.top <= offset) {
        currentId = sectionElements[i].id;
      } else {
        break;
      }
    }
    setActiveNav(currentId);
  }

  function render(query) {
    var trimmed = query.trim();
    var tokens = trimmed ? trimmed.toLowerCase().split(/\s+/) : [];
    var filtered = tokens.length
      ? entries.filter(function (entry) { return matchesQuery(entry, tokens); })
      : entries;

    searchWrapEl.classList.toggle("has-value", query.length > 0);
    countEl.textContent = "共 " + filtered.length + " 条";

    var groups = buildGroups(filtered);

    navListEl.textContent = "";
    mainEl.textContent = "";
    sectionElements = [];
    activeGroupId = "";

    if (!groups.length) {
      var emptyDiv = document.createElement("div");
      emptyDiv.className = "empty-state";

      var emptyMsg = document.createElement("p");
      emptyMsg.textContent = trimmed
        ? "未找到与 “" + trimmed + "” 匹配的命令"
        : "暂无命令数据";
      emptyDiv.appendChild(emptyMsg);

      if (trimmed) {
        var resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.className = "empty-reset";
        resetBtn.textContent = "清空搜索";
        resetBtn.addEventListener("click", function () {
          searchInputEl.value = "";
          render("");
          searchInputEl.focus();
        });
        emptyDiv.appendChild(resetBtn);
      }

      mainEl.appendChild(emptyDiv);
      return;
    }

    var navFrag = document.createDocumentFragment();
    var mainFrag = document.createDocumentFragment();

    for (var g = 0; g < groups.length; g++) {
      var grp = groups[g];

      var navLi = document.createElement("li");
      navLi.className = "nav-item";

      var navA = document.createElement("a");
      navA.className = "nav-link";
      navA.href = "#" + grp.id;
      navA.setAttribute("data-group-id", grp.id);

      var navLabel = document.createElement("span");
      navLabel.className = "nav-label";
      navLabel.textContent = grp.name;

      var navCount = document.createElement("span");
      navCount.className = "nav-count";
      navCount.textContent = String(grp.items.length);

      navA.appendChild(navLabel);
      navA.appendChild(navCount);
      navA.addEventListener("click", function (ev) {
        var targetId = ev.currentTarget.getAttribute("data-group-id");
        if (targetId) {
          setActiveNav(targetId);
        }
      });

      navLi.appendChild(navA);
      navFrag.appendChild(navLi);

      var section = document.createElement("section");
      section.className = "group-section";
      section.id = grp.id;

      var heading = document.createElement("h2");
      heading.className = "group-heading";

      var headingText = document.createElement("span");
      headingText.textContent = grp.name;

      var headingCount = document.createElement("span");
      headingCount.className = "group-heading-count";
      headingCount.textContent = grp.items.length + " 条";

      heading.appendChild(headingText);
      heading.appendChild(headingCount);
      section.appendChild(heading);

      var ul = document.createElement("ul");
      ul.className = "cmd-list";

      for (var i = 0; i < grp.items.length; i++) {
        var item = grp.items[i];
        var pathText = normalizeText(item.path);
        var descText = normalizeText(item.description);
        var flags = normalizeList(item.flags).filter(Boolean);
        var aliases = normalizeList(item.alias).filter(Boolean);

        var li = document.createElement("li");
        li.className = "cmd-item";

        var row = document.createElement("div");
        row.className = "cmd-row";

        var pathCell = document.createElement("div");
        pathCell.className = "cmd-path-cell";

        var pathBtn = document.createElement("button");
        pathBtn.type = "button";
        pathBtn.className = "cmd-path";
        pathBtn.title = "点击复制命令";
        pathBtn.setAttribute("aria-label", "复制命令 " + pathText);

        var pathSpan = document.createElement("span");
        pathSpan.textContent = pathText;
        pathBtn.appendChild(pathSpan);
        pathBtn.appendChild(createCopyIcon());

        (function (textToCopy, btn) {
          btn.addEventListener("click", function () {
            copyPath(textToCopy, btn);
          });
        })(pathText, pathBtn);

        pathCell.appendChild(pathBtn);

        var descDiv = document.createElement("div");
        descDiv.className = "cmd-desc";
        descDiv.textContent = descText;

        row.appendChild(pathCell);
        row.appendChild(descDiv);
        li.appendChild(row);

        if (flags.length || aliases.length) {
          var metaDiv = document.createElement("div");
          metaDiv.className = "cmd-meta";

          for (var f = 0; f < flags.length; f++) {
            var flagEl = document.createElement("span");
            flagEl.className = "flag-tag";
            flagEl.textContent = flags[f];
            metaDiv.appendChild(flagEl);
          }

          if (aliases.length) {
            var aliasWrap = document.createElement("span");
            aliasWrap.className = "alias-group";
            aliasWrap.textContent = "别名：";
            for (var a = 0; a < aliases.length; a++) {
              if (a > 0) {
                aliasWrap.appendChild(document.createTextNode("、"));
              }
              var aliasCode = document.createElement("span");
              aliasCode.className = "alias-item";
              aliasCode.textContent = aliases[a];
              aliasWrap.appendChild(aliasCode);
            }
            metaDiv.appendChild(aliasWrap);
          }

          li.appendChild(metaDiv);
        }

        ul.appendChild(li);
      }

      section.appendChild(ul);
      mainFrag.appendChild(section);
      sectionElements.push(section);
    }

    navListEl.appendChild(navFrag);
    mainEl.appendChild(mainFrag);

    if (sectionElements.length) {
      setActiveNav(sectionElements[0].id);
    }
  }

  searchInputEl.addEventListener("input", function () {
    render(searchInputEl.value);
  });

  searchClearEl.addEventListener("click", function () {
    searchInputEl.value = "";
    render("");
    searchInputEl.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !e.ctrlKey && !e.metaKey && !e.altKey) {
      var active = document.activeElement;
      var tag = active && active.tagName ? active.tagName.toLowerCase() : "";
      var isEditable = tag === "input" || tag === "textarea" || (active && active.isContentEditable);
      if (!isEditable) {
        e.preventDefault();
        searchInputEl.focus();
        searchInputEl.select();
      }
    } else if (e.key === "Escape") {
      if (searchInputEl.value) {
        e.preventDefault();
        searchInputEl.value = "";
        render("");
      } else if (document.activeElement === searchInputEl) {
        searchInputEl.blur();
      }
    }
  });

  var scrollTicking = false;
  window.addEventListener("scroll", function () {
    if (!scrollTicking) {
      scrollTicking = true;
      window.requestAnimationFrame(function () {
        updateActiveOnScroll();
        scrollTicking = false;
      });
    }
  }, { passive: true });

  window.addEventListener("resize", updateHeaderHeightVar, { passive: true });

  function init() {
    updateHeaderHeightVar();
    render("");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>

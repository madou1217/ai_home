<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIH 翻译设置</title><link rel="stylesheet" href="options.css"></head>
<body><main>
<header><img class="mark" src="ai-home-logo.png" alt="AIHome" width="44" height="44"><div><h1>翻译，随处可用</h1><p>AIH Translation</p></div><span class="badge">浏览器扩展</span></header>
<form id="settings-form">
<section aria-labelledby="connection-heading">
<div class="section-title"><h2 id="connection-heading">服务连接</h2><span id="connection-state" role="status">尚未连接</span></div>
<label for="endpoint">AIH Server</label><input id="endpoint" type="url" required placeholder="http://127.0.0.1:9527" spellcheck="false" autocomplete="url">
<label for="token">管理密钥 <span>仅保存在此浏览器</span></label><div class="password-field"><input id="token" type="password" autocomplete="new-password" placeholder="输入此 Server 的管理密钥"><button id="toggle-token" type="button" aria-label="显示管理密钥" aria-pressed="false">显示</button></div>
<p class="help">连接本地或远程 AIH Server。密钥不会同步到浏览器账号。</p>
</section>
<section aria-labelledby="model-heading">
<div class="section-title"><h2 id="model-heading">翻译模型</h2><button id="refresh-models" class="text-button" type="button">刷新模型</button></div>
<label class="sr-only" for="model">选择翻译模型</label><select id="model"><option value="">使用 Server 默认模型</option><option value="manual">手动指定模型…</option></select>
<div id="manual-fields" hidden><label for="manual-model">模型 ID</label><input id="manual-model" placeholder="输入完整模型 ID" spellcheck="false"><label for="manual-provider">Provider <span>可选，由 Server 自动路由</span></label><input id="manual-provider" placeholder="Provider 标识" spellcheck="false"></div>
<p id="model-status" class="help" role="status">连接后显示此 Server 已配置的模型。</p>
</section>
<section aria-labelledby="reading-heading"><h2 id="reading-heading">阅读偏好</h2>
<div class="columns"><div><label for="target">译为</label><select id="target"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select></div><div><label for="mode">网页呈现</label><select id="mode"><option value="side-by-side">保留原文与译文</option><option value="replace">替换原文</option></select></div></div>
<label class="toggle-row" for="autoCopy"><span>完成后自动复制<small>整页翻译全部完成后复制</small></span><input id="autoCopy" type="checkbox" role="switch"></label>
</section>
<footer><span id="status" role="status" aria-live="polite">设置仅影响之后发起的翻译</span><button id="save" class="primary" type="submit">保存设置</button></footer>
</form><p class="shortcut">选中文字后右键翻译 · 整页翻译可停止或撤回</p>
</main><script src="options.js"></script></body></html>

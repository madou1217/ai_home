<!doctype html><meta charset="utf-8"><title>AIH Translation Settings</title>
<style>body{font:14px system-ui,sans-serif;max-width:560px;margin:32px auto;padding:0 20px;background:#0a101a;color:#e2f1f8}label{display:block;margin:16px 0}input,select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:8px;background:#0c1524;color:#e2f1f8;border:1px solid #23405f}button{padding:8px 14px;background:#00f0ff;border:0;color:#05080e}small{color:#7f9bb3}</style>
<h1>AIH Translation</h1><p>扩展只连接你配置的 AIH Server；provider、模型和回退策略由 Server 设置决定。</p>
<label>AIH Server 地址<input id="endpoint" placeholder="http://127.0.0.1:9527"></label>
<label>Management Key（仅保存在浏览器扩展存储）<input id="token" type="password" autocomplete="new-password"></label>
<label>目标语言<select id="target"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option></select></label>
<label>整页/选区结果<select id="mode"><option value="side-by-side">旁注原文</option><option value="replace">替换原文</option></select></label>
<button id="save">保存设置</button><span id="status" style="margin-left:8px"></span><small><br>如果不希望把密钥交给扩展，请在本机使用本地 AIH Server，并通过受控的浏览器会话授权。</small>
<script src="options.js"></script>

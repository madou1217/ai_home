<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIH PDF 双语阅读</title><link rel="stylesheet" href="pdf-reader.css"></head>
<body>
<header class="bar"><img src="ai-home-logo.png" alt="" width="22" height="22"><strong id="title">PDF 双语阅读</strong><span id="status" role="status" aria-live="polite">正在打开…</span>
<label for="target" class="sr-only">译为</label><select id="target"><option value="zh-Hans">简体中文</option><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option></select>
<button id="toggle" type="button" aria-pressed="true">隐藏译文</button></header>
<main id="doc" aria-label="PDF 内容"></main>
<script type="module" src="pdf-reader.js"></script>
</body>
</html>

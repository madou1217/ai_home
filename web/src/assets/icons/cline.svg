<!--
  Cline 官方标记。来源：app.cline.bot 的 favicon（cline-outline.svg），品牌色 #1C1C24
  —— Cline 的 "Black Russian"。
  官方文件是 3 个 path（外轮廓 + 两只眼睛）；仓库的栅格化器 scripts/svg-path-raster.js 只吃
  「单 path + #rrggbb 填充」，三段的 d 已按官方顺序拼进同一个 path：三段环绕方向与官方一致，
  非零填充规则下仍是空心轮廓 + 双眼（不是简单叠加成实心块）。
  官方 style 块里的 prefers-color-scheme 深色分支（#f4f4f5）已去掉，深色由 ProviderIcon 的
  DARK_THEME_ICON_TREATMENT（cline: 'invert'）与 design-tokens 里 Cline 变量的深色重映射承担。
  改图只改本文件，再运行 node scripts/gen-provider-icons.js 重新生成
  assets/provider-icons/cline.png。
-->

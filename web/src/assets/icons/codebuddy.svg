<?xml version="1.0" standalone="no"?>
<!--
  CodeBuddy 品牌图标。

  与同目录 zcode / kimi 图标保持同一套视觉语法：1024 画布的深色圆角方块 + 白色
  主体记号 + 品牌色点缀。主体用菱形"❖"（与 builtins.go 里声明的
  `presentation(... "❖" ...)` 终端图标同形），保证列表里的图形语义与文本图标一致。

  说明：这里没有内嵌腾讯官方 Logo 的矢量路径（官方未公开可再分发的 SVG 资源），
  因此采用「同构视觉 + 官方品牌蓝 #0052D9」的自绘记号，避免伪造商标图形。若后续
  拿到官方授权素材，只需替换本文件的 path 数据，消费侧无需改动。
-->
<svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- 深色圆角底板（与 kimi.svg 的圆角半径一致：204.8 = 1024 * 0.2） -->
  <path d="M0 0m204.8 0l614.4 0q204.8 0 204.8 204.8l0 614.4q0 204.8-204.8 204.8l-614.4 0q-204.8 0-204.8-204.8l0-614.4q0-204.8 204.8-204.8Z" fill="#101010"></path>
  <!-- 白色菱形外环：外菱形 + 内菱形子路径，用 evenodd 让内圈镂空露出底板 -->
  <path d="M512 176L848 512L512 848L176 512Z M512 336L688 512L512 688L336 512Z" fill="#FFFFFF" fill-rule="evenodd"></path>
  <!-- 品牌蓝内核：镂空处填充 CodeBuddy 主色，形成"白环 + 蓝心"的 ❖ 读法 -->
  <path d="M512 384L640 512L512 640L384 512Z" fill="#0052D9"></path>
</svg>

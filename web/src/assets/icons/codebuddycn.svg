<?xml version="1.0" standalone="no"?>
<!--
  CodeBuddy CN（国内站）品牌图标。

  与同目录 codebuddy.svg 共用同一套视觉语法：1024 画布深色圆角方块 + 白色主体记号 +
  品牌色内核。主体换成四角星"✦"（与 builtins.go 里 `presentation(... "✦" ...)`
  声明的终端图标同形），与 codebuddy 的菱形"❖"形成站点区分，同时保留同一家族感。

  几何与 assets/provider-icons/codebuddycn.png 一致：星形按 astroid
  x^(2/3) + y^(2/3) = a^(2/3) 取形，尖角半轴 a=384，二次贝塞尔控制点取
  0.2072a（该系数使曲线中点正好落在 astroid 的 45° 点上）；内核同为四角星，a=176。

  说明：这里没有内嵌腾讯官方 Logo 的矢量路径（官方未公开可再分发的 SVG 资源），
  因此采用「同构视觉 + 站点品牌色 #7A3FF2」的自绘记号，避免伪造商标图形。若后续
  拿到官方授权素材，只需替换本文件的 path 数据，消费侧无需改动。
-->
<svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- 深色圆角底板（与 codebuddy.svg 的圆角半径一致：204.8 = 1024 * 0.2） -->
  <path d="M0 0m204.8 0l614.4 0q204.8 0 204.8 204.8l0 614.4q0 204.8-204.8 204.8l-614.4 0q-204.8 0-204.8-204.8l0-614.4q0-204.8 204.8-204.8Z" fill="#101010"></path>
  <!-- 白色四角星主体：尖角半轴 384，控制点 79.6 = 0.2072 * 384 -->
  <path d="M512 128Q591.6 432.4 896 512Q591.6 591.6 512 896Q432.4 591.6 128 512Q432.4 432.4 512 128Z" fill="#FFFFFF"></path>
  <!-- 站点品牌色内核：尖角半轴 176，控制点 36.5 = 0.2072 * 176 -->
  <path d="M512 336Q548.5 475.5 688 512Q548.5 548.5 512 688Q475.5 548.5 336 512Q475.5 475.5 512 336Z" fill="#7A3FF2"></path>
</svg>

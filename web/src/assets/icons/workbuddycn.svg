<?xml version="1.0" standalone="no"?>
<!--
  WorkBuddy CN（国内站）品牌图标。

  与同目录 workbuddy.svg 共用同一套视觉语法：1024 画布深色圆角方块 + 白色主体记号 +
  品牌色内核。主体换成双同心圆环、中心留空"◍"（与 builtins.go 里
  `presentation(... "◍" ...)` 声明的终端图标同形），与国际站的"◉"（环 + 实心圆心）
  一眼可分——它们是同一产品线下的两个站点，列表里必须能区分。

  几何与 assets/provider-icons/workbuddycn.png 一致：白色外环中心线半径 340、
  线宽 120（覆盖半径 280..400），站点紫内环中心线半径 150、线宽 96
  （覆盖半径 102..198），圆心留空。

  说明：这里没有内嵌腾讯官方 Logo 的矢量路径（官方未公开可再分发的 SVG 资源），
  因此采用「同构视觉 + 站点品牌色 #7A3FF2」的自绘记号，避免伪造商标图形。若后续
  拿到官方授权素材，只需替换本文件的 path 数据，消费侧无需改动。
-->
<svg viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" width="64" height="64">
  <!-- 深色圆角底板（与 codebuddy.svg 的圆角半径一致：204.8 = 1024 * 0.2） -->
  <path d="M0 0m204.8 0l614.4 0q204.8 0 204.8 204.8l0 614.4q0 204.8-204.8 204.8l-614.4 0q-204.8 0-204.8-204.8l0-614.4q0-204.8 204.8-204.8Z" fill="#101010"></path>
  <!-- 白色外环：中心线半径 340，线宽 120 -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#FFFFFF" stroke-width="120"></circle>
  <!-- 站点紫内环：中心线半径 150，线宽 96，中心留空 -->
  <circle cx="512" cy="512" r="150" fill="none" stroke="#7A3FF2" stroke-width="96"></circle>
</svg>
